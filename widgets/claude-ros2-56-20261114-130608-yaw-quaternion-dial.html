<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One yaw, four numbers</title>
<style>
html,body{margin:0;background:#0e182c;color:#e8eef7;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
.w{padding:16px;max-width:980px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px}.sub{color:#a9b8cc;font-size:14px;margin:0 0 12px}
.card{background:#13213a;border:1px solid #23395c;border-radius:12px;padding:14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.btn{background:#1b2c4a;color:#e8eef7;border:1px solid #2b4366;border-radius:8px;padding:6px 12px;font:600 13px system-ui,sans-serif;cursor:pointer}
.btn:hover{border-color:#ff8a3d}
input[type=range]{width:100%;accent-color:#ff8a3d}
svg{width:100%;height:auto;display:block}
.say{background:#0f1b31;border:1px solid #23395c;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14.5px}
.mono{font-family:ui-monospace,Consolas,monospace}
.ok{color:#66e3b0}.warn{color:#ffd24a}.dim{color:#6b7f96}
</style></head><body><div class="w">
<h1>One yaw, four numbers</h1>
<p class="sub">Turn the robot on the floor. A turn around Z only changes two of the four numbers: z = sin(yaw ÷ 2) and w = cos(yaw ÷ 2). Press the button to multiply in one small turn, as the node does on every tick.</p>
<div class="card">
<div class="row"><span>yaw: <b id="yv"></b></span></div>
<input type="range" id="y" min="-360" max="360" step="1" value="45" aria-label="yaw in degrees">
<div class="row"><button class="btn" id="inc">Multiply in one tick (0.05 rad)</button><button class="btn" id="neg">Show minus q</button><button class="btn" id="z0">Back to 0</button></div>
<div class="grid"><svg id="top" viewBox="0 0 300 300" role="img" aria-label="Robot seen from above"></svg><svg id="bars" viewBox="0 0 320 240" role="img" aria-label="The four numbers"></svg></div>
<div class="say" id="say"></div>
</div>
</div>
<script>
(function(){
var S={y:45*Math.PI/180,neg:false};
function $(i){return document.getElementById(i)}
function f6(v){var s=v.toFixed(6);return s==='-0.000000'?'0.000000':s}
function draw(){
  var y=S.y,deg=y*180/Math.PI,q=[0,0,Math.sin(y/2),Math.cos(y/2)];if(S.neg)q=q.map(function(v){return -v});
  $('yv').textContent=deg.toFixed(1)+'° = '+y.toFixed(3)+' rad';$('y').value=Math.max(-360,Math.min(360,Math.round(deg)));
  var c=150,R=95,ca=Math.cos(y),sa=Math.sin(y),g='<circle cx="150" cy="150" r="110" fill="none" stroke="#23395c"/>';
  g+='<line x1="150" y1="150" x2="270" y2="150" stroke="#ff6b6b" stroke-dasharray="5 5"/><text x="268" y="142" fill="#ff6b6b" font-size="11" text-anchor="end">odom X (0°)</text>';
  function P(a,b){return (c+(a*ca-b*sa)).toFixed(1)+','+(c-(a*sa+b*ca)).toFixed(1)}
  g+='<polygon points="'+P(-45,-34)+' '+P(45,-34)+' '+P(45,34)+' '+P(-45,34)+'" fill="rgba(255,138,61,.2)" stroke="#ff8a3d" stroke-width="2.5"/>';
  g+='<line x1="150" y1="150" x2="'+(c+R*ca).toFixed(1)+'" y2="'+(c-R*sa).toFixed(1)+'" stroke="#ff6b6b" stroke-width="3"/>';
  var a1=Math.max(-2*Math.PI,Math.min(2*Math.PI,y)),steps=40,pts=[];for(var i=0;i<=steps;i++){var t=a1*i/steps;pts.push((c+40*Math.cos(t)).toFixed(1)+','+(c-40*Math.sin(t)).toFixed(1))}
  g+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#ffd24a" stroke-width="2.5"/><text x="150" y="292" fill="#a7b8cd" font-size="11" text-anchor="middle">seen from above, yaw measured from odom X</text>';
  $('top').innerHTML=g;
  var L=['x','y','z','w'],C=['#ff6b6b','#66e3b0','#5ab4ff','#66e3b0'],b='<line x1="160" y1="20" x2="160" y2="200" stroke="#4a5a70"/><text x="60" y="218" fill="#7f93ad" font-size="10" text-anchor="middle">-1</text><text x="160" y="218" fill="#7f93ad" font-size="10" text-anchor="middle">0</text><text x="260" y="218" fill="#7f93ad" font-size="10" text-anchor="middle">1</text>';
  for(i=0;i<4;i++){var v=q[i],w=Math.abs(v)*100,x0=v<0?160-w:160,yy=30+i*44;b+='<text x="28" y="'+(yy+15)+'" fill="'+C[i]+'" font-size="15" font-weight="700">'+L[i]+'</text><rect x="'+x0.toFixed(1)+'" y="'+yy+'" width="'+w.toFixed(1)+'" height="22" rx="4" fill="'+C[i]+'" fill-opacity=".7"/><text x="315" y="'+(yy+16)+'" fill="'+C[i]+'" font-size="12" text-anchor="end" font-family="ui-monospace,Consolas,monospace">'+f6(v)+'</text>'}
  $('bars').innerHTML=b;
  var m='Half of the yaw is '+(y/2).toFixed(3)+' rad, so z = sin('+(y/2).toFixed(3)+') = '+f6(Math.sin(y/2))+' and w = cos('+(y/2).toFixed(3)+') = '+f6(Math.cos(y/2))+'. x and y stay 0 for a turn around Z.';
  if(Math.abs(deg)>180)m+=' <span class="warn">Past 180° w becomes negative. That is still a correct quaternion.</span>';
  if(S.neg)m+=' <span class="warn">All four signs flipped: this is the SAME turn as before. That is why flipping all four signs cannot undo a turn.</span>';
  $('say').innerHTML=m}
$('y').oninput=function(){S.y=+this.value*Math.PI/180;draw()};
$('inc').onclick=function(){S.y+=0.05;draw()};
$('neg').onclick=function(){S.neg=!S.neg;this.textContent=S.neg?'Show q':'Show minus q';draw()};
$('z0').onclick=function(){S.y=0;S.neg=false;$('neg').textContent='Show minus q';draw()};
draw();
})();
</script>
<script>
(function(){function s(){parent.postMessage({taWidget:location.pathname,h:document.documentElement.scrollHeight},'*')}
new ResizeObserver(s).observe(document.documentElement);addEventListener('load',s);setInterval(s,1500);})();
</script></body></html>

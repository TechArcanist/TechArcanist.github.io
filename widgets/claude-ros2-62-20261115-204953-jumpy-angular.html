<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jumpy Turning Speed</title>
<style>
html,body{margin:0;background:#0e182c;color:#e8eef7;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
.w{padding:16px;max-width:980px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px}.sub{color:#a9b8cc;font-size:14px;margin:0 0 12px}
.card{background:#13213a;border:1px solid #23395c;border-radius:12px;padding:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.btn{background:#1b2c4a;color:#e8eef7;border:1px solid #2b4366;border-radius:8px;padding:6px 12px;font:600 13px system-ui,sans-serif;cursor:pointer}
.btn:hover,.btn.on{border-color:#ff8a3d}
label.sl{display:block;font-size:14px;color:#cfe0f5;margin:6px 0}
input[type=range]{width:100%;accent-color:#ff8a3d}
svg{width:100%;height:auto;display:block}
.say{background:#0f1b31;border:1px solid #23395c;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14.5px}
.mono{font:12.5px/1.6 ui-monospace,Consolas,monospace;color:#cfe0f5;word-break:break-word}
.ok{color:#66e3b0}.bad{color:#ff6b6b}.warn{color:#ffd24a}.dim{color:#6b7f96}
</style></head><body><div class="w">
<h1>Why the measured turning speed jumps around 0.5</h1>
<p class="sub">These are the 92 angular values logged while the robot was told to turn at 0.5 rad/s. Drag or Play through the readings to see one at a time, and average a few to calm the line down.</p>
<div class="card">
<div class="row"><button class="btn" id="pl">Play</button><button class="btn" id="rs">Reset</button><span class="dim">reading <b id="tv"></b> of 92</span></div>
<label class="sl">which reading<input type="range" id="t" min="1" max="92" step="1" value="1" aria-label="reading number"></label>
<label class="sl">readings averaged: <b id="nv"></b><input type="range" id="n" min="1" max="20" step="1" value="1" aria-label="readings averaged"></label>
<svg id="sv" viewBox="0 0 640 250" role="img" aria-label="The logged angular values, one point per reading"></svg>
<div class="say" id="say"></div>
</div>
</div>
<script>
(function(){
var LOG=[0.5,0.454545,0.555556,0.454545,0.5,0.5,0.454545,0.5,0.625,0.555556,0.416667,0.454545,1.0,0.357143,0.5,0.714286,1.25,0.3125,0.454545,0.625,0.5,0.384615,0.5,0.5,0.416667,0.555556,0.625,0.625,0.357143,1.0,0.333333,0.555556,0.5,0.555556,0.454545,0.416667,0.555556,0.5,0.5,0.555556,0.454545,0.5,0.555556,0.454545,0.625,0.416667,0.555556,0.454545,0.5,0.555556,0.5,0.416667,0.625,0.555556,0.454545,0.5,0.454545,1.666667,0.3125,0.625,0.5,0.416667,0.5,0.454545,0.5,0.833333,0.384615,0.454545,0.625,0.5,0.5,0.454545,0.625,0.384615,0.555556,0.555556,0.416667,0.555556,0.5,0.5,0.454545,0.555556,0.555556,0.5,0.416667,0.5,0.833333,0.357143,0.833333,0.357143,0.555556,0.454545];
var S={t:1,play:0,id:null},R=0.033,SEP=0.17,WCMD=0.5;
var WHEEL=(WCMD*SEP/2)/R,STEP=WHEEL*0.010;
function $(i){return document.getElementById(i)}
function f(v,d){return v.toFixed(d===undefined?4:d)}
function draw(){
  var k=S.t,N=+$('n').value;$('tv').textContent=k;$('nv').textContent=N;
  var X0=50,X1=620,Y0=210,mx=1.8,sx=(X1-X0)/91,sy=(Y0-20)/mx,g='';
  [0,0.5,1,1.5].forEach(function(v){var y=Y0-v*sy;g+='<line x1="'+X0+'" y1="'+y+'" x2="'+X1+'" y2="'+y+'" stroke="#1b2c4a"/><text x="'+(X0-6)+'" y="'+(y+4)+'" fill="#6b7f96" font-size="11" text-anchor="end">'+v+'</text>'});
  g+='<text x="'+(X0-6)+'" y="14" fill="#6b7f96" font-size="11" text-anchor="end">rad/s</text>';
  var y5=Y0-0.5*sy;g+='<line x1="'+X0+'" y1="'+y5+'" x2="'+X1+'" y2="'+y5+'" stroke="#66e3b0" stroke-dasharray="5 4"/><line x1="'+(X1-150)+'" y1="10" x2="'+(X1-124)+'" y2="10" stroke="#66e3b0" stroke-dasharray="5 4"/><text x="'+(X1-118)+'" y="14" fill="#66e3b0" font-size="11">command 0.5 rad/s</text>';
  LOG.forEach(function(v,i){g+='<circle cx="'+(X0+i*sx).toFixed(1)+'" cy="'+(Y0-Math.min(v,mx)*sy).toFixed(1)+'" r="'+(i===k-1?6:2.6)+'" fill="'+(i===k-1?'#ff8a3d':'#5f7391')+'"/>'});
  var av=[];for(var i=0;i<LOG.length;i++){var s=0,c=0;for(var j=Math.max(0,i-N+1);j<=i;j++){s+=LOG[j];c++}av.push(s/c)}
  if(N>1)g+='<polyline fill="none" stroke="#ffd24a" stroke-width="2" points="'+av.map(function(v,i){return (X0+i*sx).toFixed(1)+','+(Y0-Math.min(v,mx)*sy).toFixed(1)}).join(' ')+'"/>';
  g+='<text x="'+X0+'" y="'+(Y0+22)+'" fill="#6b7f96" font-size="11">reading 1</text><text x="'+X1+'" y="'+(Y0+22)+'" fill="#6b7f96" font-size="11" text-anchor="end">reading 92 (about 1.3 s later)</text>';
  g+='<text x="'+((X0+X1)/2)+'" y="'+(Y0+38)+'" fill="#6b7f96" font-size="11" text-anchor="middle">grey: each logged value · orange: the chosen reading'+(N>1?' · yellow: average of the last '+N:'')+'</text>';
  $('sv').innerHTML=g;
  var v=LOG[k-1],n=Math.round(5/v),dt=n/1000,back=R*(STEP+STEP)/SEP/dt;
  var sn=LOG.reduce(function(a,b){return a+5/b},0),avg=LOG.reduce(function(a,b){return a+b},0)/92;
  $('say').innerHTML='<b>Reading '+k+': angular '+f(v,6)+' rad/s.</b>'+(N>1?' Average of the last '+Math.min(N,k)+': <b>'+f(av[k-1],4)+'</b>.':'')+
   '<div class="mono" style="margin-top:6px">My reading of the numbers (a guess, not something the code says): with the command, each wheel turns at (0.5 × 0.085) ÷ 0.033 = '+f(WHEEL)+' rad/s, so in 10 ms it turns '+f(WHEEL)+' × 0.010 = '+f(STEP,6)+' rad. If every message moves the wheels by that 10 ms step, but the stamps are '+n+' ms apart:<br>angular = 0.033 × ('+f(STEP,6)+' + '+f(STEP,6)+') ÷ 0.17 ÷ '+f(dt,3)+' = <b>'+f(back,6)+'</b>, exactly the logged value. Every one of the 92 values fits a whole number of milliseconds between 3 and 16.</div>'+
   '<div style="margin-top:6px">Under that guess the honest average is total angle ÷ total time: 0.5 × 10 ms × 92 ÷ '+Math.round(sn)+' ms = <b>'+f(0.5*10*92/sn,4)+' rad/s</b>. The plain average of the 92 numbers is '+f(avg,4)+', pulled up by a few big values like 1.666667. The formula is right; the time between two messages is just very short and uneven, so averaging several readings gives a calmer number.</div>'}
function stop(){if(S.id){clearInterval(S.id);S.id=null}S.play=0;$('pl').textContent='Play'}
$('pl').onclick=function(){if(S.play){stop();return}S.play=1;this.textContent='Pause';if(S.t>=92)S.t=1;
  S.id=setInterval(function(){S.t=Math.min(92,S.t+1);$('t').value=S.t;draw();if(S.t>=92)stop()},180)};
$('rs').onclick=function(){stop();S.t=1;$('t').value=1;$('n').value=1;draw()};
$('t').oninput=function(){S.t=+this.value;draw()};
$('n').oninput=draw;
draw();
})();
</script>
<script>
(function(){function s(){parent.postMessage({taWidget:location.pathname,h:document.documentElement.scrollHeight},'*')}
new ResizeObserver(s).observe(document.documentElement);addEventListener('load',s);setInterval(s,1500);})();
</script></body></html>

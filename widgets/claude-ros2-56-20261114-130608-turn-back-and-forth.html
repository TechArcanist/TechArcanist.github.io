<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turning back and forth</title>
<style>
html,body{margin:0;background:#0e182c;color:#e8eef7;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
.w{padding:16px;max-width:980px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px}.sub{color:#a9b8cc;font-size:14px;margin:0 0 12px}
.card{background:#13213a;border:1px solid #23395c;border-radius:12px;padding:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.btn{background:#1b2c4a;color:#e8eef7;border:1px solid #2b4366;border-radius:8px;padding:6px 12px;font:600 13px system-ui,sans-serif;cursor:pointer}
.btn:hover{border-color:#ff8a3d}
input[type=range]{width:100%;accent-color:#ff8a3d}
svg{width:100%;height:auto;display:block}
.say{background:#0f1b31;border:1px solid #23395c;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14.5px}
.dim{color:#6b7f96}
</style></head><body><div class="w">
<h1>Turning back and forth</h1>
<p class="sub">Every 0.1 s the base moves 5 cm along odom X and turns 0.05 rad. After 100 ticks the small turn is replaced by its inverse. Press Play or drag the time.</p>
<div class="card">
<div class="row"><button class="btn" id="pl">Play</button><button class="btn" id="rs">Reset</button><span class="dim">time: <b id="tv"></b></span></div>
<input type="range" id="t" min="0" max="40" step="0.1" value="0" aria-label="time">
<svg id="sv" viewBox="0 0 640 330" role="img" aria-label="The base from above, the counter and the yaw over time"></svg>
<div class="say" id="say"></div>
</div>
</div>
<script>
(function(){
var S={t:0,play:0,id:null};
function $(i){return document.getElementById(i)}
function run(t){var n=Math.floor(t*10+1e-9),y=0,dir=1,c=0,pts=[[0,0]];for(var i=0;i<n;i++){y+=dir*0.05;c++;if(c>=100){dir=-dir;c=0}pts.push([(i+1)/10,y])}return{n:n,y:y,dir:dir,c:c,x:n*0.05,pts:pts}}
function draw(){
  var o=run(S.t),g='';$('tv').textContent=S.t.toFixed(1)+' s';
  /* top view */
  g+='<text x="150" y="18" fill="#a7b8cd" font-size="12" text-anchor="middle" font-weight="700">the base, seen from above</text>';
  g+='<rect x="10" y="30" width="280" height="180" rx="10" fill="#0b1626" stroke="#23395c"/><line x1="20" y1="120" x2="280" y2="120" stroke="#ff6b6b" stroke-dasharray="5 5"/><text x="278" y="112" fill="#ff6b6b" font-size="10" text-anchor="end">odom X</text>';
  var cx=150,cy=120,ca=Math.cos(o.y),sa=Math.sin(o.y);function P(a,b){return (cx+(a*ca-b*sa)).toFixed(1)+','+(cy-(a*sa+b*ca)).toFixed(1)}
  g+='<polygon points="'+P(-36,-27)+' '+P(36,-27)+' '+P(36,27)+' '+P(-36,27)+'" fill="rgba(255,138,61,.2)" stroke="#ff8a3d" stroke-width="2.5"/><line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+70*ca).toFixed(1)+'" y2="'+(cy-70*sa).toFixed(1)+'" stroke="#ff6b6b" stroke-width="3"/>';
  g+='<text x="150" y="200" fill="#ffd24a" font-size="12" text-anchor="middle">yaw '+o.y.toFixed(2)+' rad ('+(o.y*180/Math.PI).toFixed(0)+'°), x = '+o.x.toFixed(2)+' m</text>';
  /* counter */
  g+='<text x="470" y="18" fill="#a7b8cd" font-size="12" text-anchor="middle" font-weight="700">rotations_counter_ (resets at 100)</text>';
  g+='<rect x="320" y="34" width="300" height="22" rx="5" fill="#0b1626" stroke="#23395c"/><rect x="320" y="34" width="'+(o.c*3).toFixed(1)+'" height="22" rx="5" fill="'+(o.dir>0?'#ff8a3d':'#5ab4ff')+'"/>';
  g+='<text x="470" y="74" fill="#cfe0f5" font-size="12" text-anchor="middle">'+o.c+' of 100, turning '+(o.dir>0?'plus yaw':'minus yaw')+'</text>';
  /* yaw over time */
  var X0=330,Y0=200,sx=290/40,sy=110/5;g+='<line x1="'+X0+'" y1="'+Y0+'" x2="'+(X0+290)+'" y2="'+Y0+'" stroke="#4a5a70"/><line x1="'+X0+'" y1="'+Y0+'" x2="'+X0+'" y2="'+(Y0-115)+'" stroke="#4a5a70"/>';
  g+='<text x="'+(X0-4)+'" y="'+(Y0-106)+'" fill="#7f93ad" font-size="10" text-anchor="end">5 rad</text><text x="'+(X0-4)+'" y="'+(Y0+4)+'" fill="#7f93ad" font-size="10" text-anchor="end">0</text>';
  for(var s=0;s<=40;s+=10)g+='<text x="'+(X0+s*sx)+'" y="'+(Y0+16)+'" fill="#7f93ad" font-size="10" text-anchor="middle">'+s+' s</text>';
  g+='<polyline fill="none" stroke="#ff8a3d" stroke-width="2" points="'+o.pts.map(function(p){return (X0+p[0]*sx).toFixed(1)+','+(Y0-p[1]*sy).toFixed(1)}).join(' ')+'"/>';
  g+='<text x="'+(X0+145)+'" y="'+(Y0+34)+'" fill="#a7b8cd" font-size="11" text-anchor="middle">yaw against time</text>';
  g+='<text x="320" y="300" fill="#a7b8cd" font-size="11.5" text-anchor="middle">The base always moves along odom X, whichever way it faces: it slides sideways when turned.</text>';
  $('sv').innerHTML=g;
  var m=o.n+' ticks. ';if(o.n<100)m+='Turning one way: the yaw grows by 0.05 rad every tick.';else if(o.c===0&&o.n%100===0)m+='Tick '+o.n+': the counter reached 100, so the small turn was replaced by its inverse and the counter started again.';else m+=(o.dir>0?'Turning forward again.':'Turning back: each tick now adds the inverse, minus 0.05 rad.');
  $('say').textContent=m}
function stop(){if(S.id){clearInterval(S.id);S.id=null}S.play=0;$('pl').textContent='Play'}
$('pl').onclick=function(){if(S.play){stop();return}S.play=1;this.textContent='Pause';if(S.t>=40)S.t=0;var last=Date.now();S.id=setInterval(function(){var n=Date.now();S.t=Math.min(40,S.t+(n-last)/1000);last=n;$('t').value=S.t;draw();if(S.t>=40)stop()},50)};
$('rs').onclick=function(){stop();S.t=0;$('t').value=0;draw()};
$('t').oninput=function(){S.t=+this.value;draw()};
draw();
})();
</script>
<script>
(function(){function s(){parent.postMessage({taWidget:location.pathname,h:document.documentElement.scrollHeight},'*')}
new ResizeObserver(s).observe(document.documentElement);addEventListener('load',s);setInterval(s,1500);})();
</script></body></html>

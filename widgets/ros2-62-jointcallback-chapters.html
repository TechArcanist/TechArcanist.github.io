</div></div>

  [['green line','where the robot really is'],['orange dashes','where odometry thinks it is'],['',''],['after 6 s (600 readings):',''],['real x, y',f(tr.x,3)+', '+f(tr.y,3)+' m'],['odometry x, y',f(od.x,3)+', '+f(od.y,3)+' m'],['drift',f(err,3)+' m']].forEach(function(r,i){g+=T(452,86+i*24,r[0],i===0?'#66e3b0':i===1?'#ff8a3d':'#8ea3bd','start',12,500)+T(690,86+i*24,r[1],i===6&&err>0.005?'#ff6b6b':'#e8eef7','end',12)});
  g+=T(570,300,'turn on a Ch 60 error to see drift','#6b7f96','middle',11.5);
  return g}
function info(o,st){
  var w='',h='',k1=o.k===1;
  if(st===0){h='Each joint_states message is one <b>encoder</b> reading (chapter 60): the angle of each wheel in radians. It keeps growing while the wheel turns, so it works like an odometer for each wheel. Item 0 is the left wheel and item 1 the right wheel (the order this code assumes).';
    w='reading '+o.k+' at t = '+f(o.t1,3)+' s\nleft  φ = '+f(o.wL,4)+' rad/s × '+f(o.t1-5,3)+' s = '+f(o.p1L)+' rad\nright φ = '+f(o.wR,4)+' rad/s × '+f(o.t1-5,3)+' s = '+f(o.p1R)+' rad\n(the wheels started turning at 5.000 s; wheel speeds come from the command: right = (V + ω × s ÷ 2) ÷ r = ('+o.V+' + '+o.W+' × 0.085) ÷ 0.033 = '+f(o.wR,4)+')'}
  if(st===1){h='Chapter 61 needs the time of each reading: t1 for "now". The code takes it from the message stamp, the moment the angles were measured, not from the computer clock.';w='now = Time.from_msg(stamp) = '+f(o.t1,3)+' s'}
  if(st===2){h='Chapter 61: a speed needs <b>two</b> readings, a "before" (φ0 at t0) and a "now" (φ1 at t1). The very first message has no "before", so the code only stores it and returns. Chapter 59: odometry is counting steps, and counting has to start somewhere.';
    w=k1?'reading 1: prev_time_ is None, so lines 55 to 58 store the angles and the time, then return. No speed yet.\nMove "reading number" to 2 or more to continue.':'reading '+o.k+': prev_time_ is already set ('+f(o.t0,3)+' s) and now ('+f(o.t1,3)+') is not earlier, so this block is skipped.'}
  if(st===3){h='Chapter 61: <b>Δt = t1 - t0</b>, the time between the two readings. Line 61 stops a division by zero if a stamp repeats.';
    w=k1?'reading 1 never gets here (it returned on line 58).':'Δt = '+f(o.t1,3)+' - '+f(o.t0,3)+' = '+f(o.dt,3)+' s\n(the Duration is '+Math.round(o.dt*1e9)+' ns; ÷ 1 000 000 000 = '+f(o.dt,3)+' s)'}
  if(st===4){h='Chapter 61: <b>Δφ = φ1 - φ0</b>, how far each wheel turned between the readings. Chapter 60: the angle comes straight from the encoder, so any encoder or wheel error is already inside Δφ.';
    w=k1?'reading 1 never gets here.':'Δφ left  = '+f(o.p1L)+' - '+f(o.p0L)+' = '+f(o.dpL)+' rad\nΔφ right = '+f(o.p1R)+' - '+f(o.p0R)+' = '+f(o.dpR)+' rad'}
  if(st===5){h='Chapter 59: odometry counts step after step. After using the old values, this reading becomes the "before" for the next message. About 100 times a second the same small step is repeated.';
    w=k1?'reading 1 stored its values on lines 55 to 57 instead.':'stored for the next message: left '+f(o.p1L)+' rad, right '+f(o.p1R)+' rad, time '+f(o.t1,3)+' s'}
  if(st===6){h='Chapter 61: <b>φ̇ = Δφ ÷ Δt</b>, the speed of each wheel in rad/s. dt is already in seconds, so it is a plain division.';
    w=k1?'reading 1 never gets here.':'φ̇L = '+f(o.dpL)+' ÷ '+f(o.dt,3)+' = '+f(o.fL,4)+' rad/s\nφ̇R = '+f(o.dpR)+' ÷ '+f(o.dt,3)+' = '+f(o.fR,4)+' rad/s'}
  if(st===7){h='Chapter 61: the two rows of the matrix give the robot speed. Chapter 60: <b>r</b> turns rotation into rolling, so a wrong radius gives a wrong speed with no error message.';
    w='V = (0.033 × '+f(o.fR,4)+' + 0.033 × '+f(o.fL,4)+') ÷ 2 = '+f(o.Vm,4)+' m/s\nω = (0.033 × '+f(o.fR,4)+' - 0.033 × '+f(o.fL,4)+') ÷ 0.17 = '+f(o.Wm,4)+' rad/s'+
      ($('wear').checked||$('slip').checked?'\nreally: V '+f(o.Vt,4)+' m/s, ω '+f(o.Wt,4)+' rad/s (worn radius '+o.rr+' m'+(o.kl<1?', left wheel moves the robot only '+o.kl*100+' % of what it turns':'')+')':'\nmeasurement = command: the matrix undoes the inverse used in velCallback.')}
  if(st===8){h='The code stops at the speed. Chapter 59 goal: add up these small steps over time to get the position x, y and heading, which is the transform from the start frame O to the robot R from chapter 58. Chapter 60: every reading carries the same small error, so the errors add up too, and that is drift.';
    w='each step: x += V × cos(heading) × Δt, y += V × sin(heading) × Δt, heading += ω × Δt\n(the next chapters build this; here it is simulated with Δt = 0.01 s for 600 readings)'}
  var lk='<div class="links"><b>Go to the section this step comes from (opens in a new tab):</b>'+LINKS[st].map(function(x){return '<a href="'+x[1]+'" target="_blank" rel="noopener"><span class="c '+CH[x[0]][0].replace('b','t')+'">Ch '+x[0]+'</span>'+x[2]+'</a>'}).join('')+'</div>';
  return '<div class="badges">'+STEPS[st].c.map(function(c){return '<span class="bd '+CH[c][0]+'">'+CH[c][1]+'</span>'}).join('')+'</div><h2>'+STEPS[st].t+'</h2><div>'+h+'</div><div class="work">'+w+'</div>'+lk}
function draw(){
  var st=S.st,o=M();
  $('vv').textContent=f(o.V,2);$('wv').textContent=f(o.W,1);$('dv').textContent=Math.round(o.dt*1000);$('kv').textContent=o.k+(o.k===1?' (first)':'');
  $('cnt').textContent='step '+(st+1)+' of '+STEPS.length;

  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(b){b.onclick=function(){stop();S.st=+b.dataset.i;draw()}});

  $('code').innerHTML=CODE.map(function(c){return '<div class="cl'+(on[c[0]]?' on':'')+'"><span class="n">'+c[0]+'</span>'+(c[1].replace(/&/g,'&amp;').replace(/</g,'&lt;')||' ')+'</div>'}).join('');
  $('sv').innerHTML=st<=6?sceneWheels(o,st):st===7?sceneRobot(o):scenePath(o);
  $('say').innerHTML=info(o,st);
  $('pv').disabled=st===0;$('nx').disabled=st===STEPS.length-1}
function stop(){if(S.play){clearInterval(S.play);S.play=null;$('pl').textContent='Play'}}
$('pv').onclick=function(){stop();S.st=Math.max(0,S.st-1);draw()};

['V','W','D','K'].forEach(function(i){$(i).oninput=draw});['wear','slip'].forEach(function(i){$(i).onchange=draw});
draw();
(function(){

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading the view_frames graph</title>
<style>
html,body{margin:0;background:#0e182c;color:#e8eef7;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
.w{padding:16px;max-width:980px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px}.sub{color:#a9b8cc;font-size:14px;margin:0 0 12px}
.card{background:#13213a;border:1px solid #23395c;border-radius:12px;padding:14px}
.grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
svg{width:100%;height:auto;display:block}
.flds{display:grid;gap:6px}
.f{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;background:#0f1b31;border:1px solid #23395c;border-radius:9px;padding:8px 10px;cursor:pointer}
.f:hover,.f.on{border-color:#ff8a3d}
@media (max-width:520px){.f{grid-template-columns:1fr}}
.f b{color:#a9b8cc;font-size:13px}.f .v{font:13.5px ui-monospace,Consolas,monospace;color:#ffd9bf;word-break:break-all}
.say{background:#0f1b31;border:1px solid #23395c;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14.5px;min-height:96px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.btn{background:#1b2c4a;color:#e8eef7;border:1px solid #2b4366;border-radius:8px;padding:6px 12px;font:600 13px system-ui,sans-serif;cursor:pointer}
.btn.on,.btn:hover{border-color:#ff8a3d}
.dim{color:#6b7f96}
</style></head><body><div class="w">
<h1>Reading the view_frames graph</h1>
<p class="sub">view_frames listened to the transforms for 5 seconds and drew one arrow per parent and child. Click an arrow, then click a line on the right to see what it means.</p>
<div class="card">
<div class="row"><button class="btn on" data-e="0">odom → bumperbot_base (moving)</button><button class="btn" data-e="1">bumperbot_base → bumperbot_top (static)</button></div>
<div class="grid"><svg id="sv" viewBox="0 0 320 360" role="img" aria-label="The TF tree with two arrows"></svg><div><div class="flds" id="fl"></div><div class="say" id="say"></div></div></div>
</div>
</div>
<script>
(function(){
var E=[{p:'odom',c:'bumperbot_base',kind:'moving (/tf)',F:[['Broadcaster','default_authority','Who sent the transforms. ROS 2 nodes in Python show this default name unless they set one (as far as I know).'],
  ['Average rate','10.2','How many transforms arrived per second while view_frames listened. The timer sends one every 0.1 s, so about 10 per second; measured over a short time it comes out a little above or below.'],
  ['Buffer length','5.0','The time between the oldest and the newest transform kept, in seconds: it listened for 5 seconds.'],
  ['Most recent transform','1794304220.375849','The time stamp of the newest transform, in seconds since 1 January 1970.'],
  ['Oldest transform','1794304215.375905','The time stamp of the oldest one. Newest minus oldest = 5.0 s, the buffer length.']]},
 {p:'bumperbot_base',c:'bumperbot_top',kind:'static (/tf_static)',F:[['Broadcaster','default_authority','The same node sent it.'],
  ['Average rate','10000.0','A static transform is sent once and is valid at every time, so there is no real rate. As far as I know the tool shows this fixed large number for static transforms.'],
  ['Buffer length','0.0','There is only one transform with no time range, so the length is 0.'],
  ['Most recent transform','0.0','Static transforms have time 0: valid always. The same 0 appears as "At time 0.0" in tf2_echo for this pair.'],
  ['Oldest transform','0.0','Also 0, for the same reason.']]}];
var S={e:0,f:-1};
function $(i){return document.getElementById(i)}
function draw(){
  var g='',N=[['odom',60],['bumperbot_base',180],['bumperbot_top',300]];
  N.forEach(function(n){g+='<ellipse cx="160" cy="'+n[1]+'" rx="'+(n[0].length*5.2+22)+'" ry="22" fill="#0f1d30" stroke="#5ab4ff" stroke-width="2"/><text x="160" y="'+(n[1]+5)+'" fill="#eef3fa" font-size="14" text-anchor="middle" font-weight="700">'+n[0]+'</text>'});
  [[82,158,0],[202,278,1]].forEach(function(a){var on=S.e===a[2];g+='<line x1="160" y1="'+a[0]+'" x2="160" y2="'+(a[1]-4)+'" stroke="'+(on?'#ff8a3d':'#4a5a70')+'" stroke-width="'+(on?4:2)+'"/><path d="M152 '+(a[1]-12)+' L160 '+a[1]+' L168 '+(a[1]-12)+'" fill="'+(on?'#ff8a3d':'#4a5a70')+'"/>'+
    '<text x="176" y="'+((a[0]+a[1])/2+4)+'" fill="'+(on?'#ffd24a':'#7f93ad')+'" font-size="12">'+E[a[2]].kind+'</text>'});
  g+='<text x="160" y="352" fill="#7f93ad" font-size="11" text-anchor="middle">arrow = parent to child, as in the PDF</text>';
  $('sv').innerHTML=g;
  var e=E[S.e];$('fl').innerHTML=e.F.map(function(f,i){return '<div class="f'+(i===S.f?' on':'')+'" data-f="'+i+'"><b>'+f[0]+'</b><span class="v">'+f[1]+'</span></div>'}).join('');
  [].slice.call(document.querySelectorAll('[data-e]')).forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-e')===S.e)});
  $('say').innerHTML=S.f<0?'<span class="dim">Click a line to see what it means. Parent '+e.p+', child '+e.c+'.</span>':'<b>'+e.F[S.f][0]+'.</b> '+e.F[S.f][2]}
document.addEventListener('click',function(ev){var t=ev.target.closest&&ev.target.closest('[data-e],[data-f]');if(!t)return;
  if(t.hasAttribute('data-e')){S.e=+t.getAttribute('data-e');S.f=-1}else S.f=+t.getAttribute('data-f');draw()});
draw();
})();
</script>
<script>
(function(){function s(){parent.postMessage({taWidget:location.pathname,h:document.documentElement.scrollHeight},'*')}
new ResizeObserver(s).observe(document.documentElement);addEventListener('load',s);setInterval(s,1500);})();
</script></body></html>

<div class="np-app">

        </div>

        <h1>
            What are <span>node parameters</span>?
        </h1>

        <p class="np-lede">
            A parameter is just a <b>setting</b> — a number or word you can change —
            that tells a piece of robot software how to behave,
            without you touching a single line of its code.
        </p>

    </header>


    <section class="np-section">

        <div class="np-section-h">
            <span class="num">01</span>
            <h2>Start with something you already know</h2>
        </div>

        <div class="np-analogy">

            <div class="np-analogy-icon">
                🔊
            </div>

            <div>

                <p>
                    Turning up the volume on a speaker doesn't rewrite the speaker's
                    software. The software already knows how to play sound at
                    <i>any</i> volume — turning the knob just tells it
                    <b class="hl">which</b> volume to use, right now.
                </p>

                <p>
                    A ROS 2 parameter is that same knob, except it's attached to a
                    piece of robot software instead of a speaker. The code never changes.
                    Only the number you hand it does.
                </p>

            </div>

        </div>

    </section>


    <section class="np-section">

        <div class="np-section-h">
            <span class="num">02</span>
            <h2>Meet "path planning" — the example we'll use</h2>
        </div>

        <p class="np-p">
            Before a robot can drive anywhere, <b class="hl">something</b> has to work
            out how to actually get there — which way to turn, how fast to go,
            how tightly to swing around a corner. That "something" is a small program
            called a <b class="hl">path planning node</b>. Give it a goal, and it
            outputs a stream of drive commands to get there.
        </p>

        <p class="np-p">
            Here's the interesting part: the exact same path-planning program can run
            on very different robots — say, a robot that steers with
            <b class="hl">two wheels</b>, and a robot that steers with
            <b class="hl">four mecanum wheels</b> that can slide sideways.
            The code doesn't need to be rewritten for each one. Only its
            <b class="hl">parameters</b> — its settings — need to change.
        </p>

    </section>


    <section class="np-section">

        <div class="np-section-h">

            <h2>

            drop 1–5 waypoints. Press <b class="hl">Plan &amp; Drive</b> and watch

            robot's configured movement capabilities. The planner decides the motion
            command; a separate robot-specific kinematics step converts that command
            into wheel speeds.
        </p>

/* ==================================================================
   SHARED HELPERS + REALISTIC ROBOT MODEL
   ================================================================== */

const $ = function (id) {
    return shadow.getElementById(id);
};

const NS = 'http://www.w3.org/2000/svg';

const TEAL = '#4dd6c0';

const UPM = 343;

const RU = 11.3;

const R_W = 0.033,
      SEP = 0.14,
      KLXY = 0.109;


function mk(tag, attrs, parent) {

    const e = document.createElementNS(NS, tag);

    for (const k in attrs) {
        e.setAttribute(k, attrs[k]);
    }

    if (parent) {
        parent.appendChild(e);
    }

    return e;
}


const clamp = function (v, a, b) {
    return Math.max(a, Math.min(b, v));
};


function shortestDelta(from, to) {

    let d = to - from;

    while (d > Math.PI) d -= 2 * Math.PI;

    while (d < -Math.PI) d += 2 * Math.PI;

    return d;
}


function signed(n, d) {

    return (n >= 0 ? '+' : '') + n.toFixed(d);

}


function diffSpeeds(v, w) {

    return [
        (v - w * SEP / 2) / R_W,
        (v + w * SEP / 2) / R_W
    ];

}


function mecSpeeds(vx, vy, w) {

    return [
        (vx - vy - KLXY * w) / R_W,
        (vx + vy + KLXY * w) / R_W,
        (vx + vy - KLXY * w) / R_W,
        (vx - vy + KLXY * w) / R_W
    ];

}


function gridPath(w, h, step) {

    let d = '';

    for (let x = step; x < w; x += step) {
        d += 'M' + x + ' 0V' + h + ' ';
    }

    for (let y = step; y < h; y += step) {
        d += 'M0 ' + y + 'H' + w + ' ';
    }

    return d;
}


shadow.querySelectorAll('.np-gridpath').forEach(function (p) {

    p.setAttribute(
        'd',
        gridPath(300, 220, 20)
    );

});


/* ============================================================
   WHEEL
   ============================================================ */

function makeWheel(parent, cx, cy, len, thick, skew) {

    mk(
        'rect',
        {
            x: cx - len / 2,
            y: cy - thick / 2,
            width: len,
            height: thick,
            rx: 2,
            fill: '#0a0f0c',
            stroke: TEAL,
            'stroke-width': 1.4,
            'vector-effect': 'non-scaling-stroke'
        },
        parent
    );

    const g = mk(
        'g',
        {
            transform:
                'translate(' + cx + ' ' + cy + ') skewX(' + skew + ')'
        },
        parent
    );

    const line = mk(
        'line',
        {
            x1: len / 2 - 1.4,
            y1: 0,
            x2: -len / 2 + 1.4,
            y2: 0,
            stroke: TEAL,
            'stroke-opacity': 0.6,
            'stroke-width': thick - 1.8,
            'stroke-dasharray': '1.8 3.6'
        },
        g
    );

    return {
        line: line
    };

}


/* ============================================================
   ROBOT
   ============================================================ */

function makeRobot(kind, parent, scale) {

    const g = mk('g', {}, parent);

    const wheels = [];

    const SW = {
        'stroke-width': 1.6,
        'vector-effect': 'non-scaling-stroke'
    };


    if (kind === 'diff') {

        mk(
            'line',
            {
                x1: 0,
                y1: -24,
                x2: 0,
                y2: 24,
                stroke: '#5c6c65',
                'stroke-width': 2
            },
            g
        );


        wheels.push(
            makeWheel(
                g,
                0,
                -24,
                22.6,
                6.8,
                0
            )
        );


        wheels.push(
            makeWheel(
                g,
                0,
                24,
                22.6,
                6.8,
                0
            )
        );


        mk(
            'rect',
            Object.assign(
                {
                    x: -22,
                    y: -17,
                    width: 44,
                    height: 34,
                    rx: 9,
                    fill: 'rgba(255,138,61,0.20)',
                    stroke: '#ff8a3d'
                },
                SW
            ),
            g
        );


        mk(
            'circle',
            {
                cx: 15,
                cy: 0,
                r: 3.2,
                fill: '#fb923c',
                stroke: '#0d1512',
                'stroke-width': 0.8
            },
            g
        );


        mk(
            'circle',
            {
                cx: -15,
                cy: 0,
                r: 3.2,
                fill: '#fb923c',
                stroke: '#0d1512',
                'stroke-width': 0.8
            },
            g
        );


        mk(
            'circle',
            {
                cx: -3,
                cy: 0,
                r: 5.5,
                fill: '#0d1512',
                stroke: '#8fa39a',
                'stroke-width': 1
            },
            g
        );


        mk(
            'circle',
            {
                cx: -3,
                cy: 0,
                r: 1.6,
                fill: '#7cd992'
            },
            g
        );


    } else {

        wheels.push(
            makeWheel(g, 16, -23, 18, 7, -35)
        );

        wheels.push(
            makeWheel(g, 16, 23, 18, 7, 35)
        );

        wheels.push(
            makeWheel(g, -16, -23, 18, 7, 35)
        );

        wheels.push(
            makeWheel(g, -16, 23, 18, 7, -35)
        );


        mk(
            'rect',
            Object.assign(
                {
                    x: -27,
                    y: -17,
                    width: 54,
                    height: 34,
                    rx: 7,
                    fill: 'rgba(201,166,255,0.20)',
                    stroke: '#c9a6ff'
                },
                SW
            ),
            g
        );


        mk(
            'rect',
            {
                x: -12,
                y: -9,
                width: 24,
                height: 18,
                rx: 3,
                fill: '#0d1512',
                stroke: '#8fa39a',
                'stroke-width': 1
            },
            g
        );


        mk(
            'circle',
            {
                cx: 0,
                cy: 0,
                r: 1.8,
                fill: '#7cd992'
            },
            g
        );

    }


    const fx = kind === 'diff' ? 23 : 28;


    mk(
        'path',
        {
            d:
                'M' +
                (fx + 7) +
                ',0 L' +
                fx +
                ',-5 L' +
                fx +
                ',5 Z',
            fill: '#ff6b6b'
        },
        g
    );


    return {

        g: g,

        wheels: wheels,

        scale: scale,

        setPose: function (x, y, h) {

            g.setAttribute(
                'transform',
                'translate(' +
                x.toFixed(2) +
                ' ' +
                y.toFixed(2) +
                ') rotate(' +
                (h * 180 / Math.PI).toFixed(2) +
                ') scale(' +
                scale +
                ')'
            );

        },

        setPhases: function (arr) {

            for (
                let i = 0;
                i < wheels.length;
                i++
            ) {

                wheels[i].line.setAttribute(
                    'stroke-dashoffset',
                    (arr[i] || 0).toFixed(2)
                );

            }

        }

    };

}

    };

    const PXM = UPM,

    let mode = 'diff',

        trailD = '';

    const st = {
        x: START.x,
        y: START.y,
        h: -Math.PI / 2,
        ph: [0,0,0,0]
    };


    function resetPose() {

        st.x = START.x;
        st.y = START.y;
        st.h = -Math.PI / 2;
        st.ph = [0,0,0,0];

        robot.setPose(
            st.x,

        );

        robot.setPhases(st.ph);

        trailEl.setAttribute(

        );

    }


    function buildRobot() {

        layer.innerHTML = '';

        robot = makeRobot(

        );

        resetPose();

    }


    function svgPoint(evt) {

        const pt = svg.createSVGPoint();

        pt.x = evt.clientX;
        pt.y = evt.clientY;

        const p =
            pt.matrixTransform(
                svg.getScreenCTM().inverse()
            );

        return {
            x: clamp(p.x,18,282),
            y: clamp(p.y,18,202)
        };

    }


    function render() {

        ptsG.innerHTML = '';
        pathG.innerHTML = '';

        const all =
            [START].concat(pts);


        if (all.length > 1) {

            let d =
                'M ' +
                all[0].x +

            ) {

            mk(

                },

            );

        }


        pts.forEach(
            function (p,i) {

                mk(
                    'circle',
                    {
                        cx: p.x,
                        cy: p.y,
                        r: 5.5,
                        fill:
                            i === pts.length - 1
                                ? '#ff6b6b'
                                : '#e7ede9',
                        stroke: '#0d1512',
                        'stroke-width': 1
                    },
                    ptsG
                );


                const t =
                    mk(
                        'text',
                        {
                            x: p.x + 8,
                            y: p.y - 7,
                            fill: '#8fa39a',
                            'font-size': 9,
                            'font-family':
                                'IBM Plex Mono, monospace'
                        },
                        ptsG
                    );


                t.textContent =
                    String(i + 1);

            }
        );


        mk(
            'circle',
            {
                cx: START.x,
                cy: START.y,
                r: 3,
                fill: '#7cd992'
            },
            ptsG
        );


        runBtn.disabled =
            pts.length < 1 ||
            animating;


        if (!animating) {

            caption.textContent =
                pts.length === 0
                    ? 'click the grid to add a stop'
                    : pts.length +
                      ' waypoint' +
                      (pts.length > 1 ? 's' : '') +
                      ' placed - press Plan & Drive';

        }

    }


    stage.addEventListener(
        'click',
        function (e) {

            if (
                animating ||
                pts.length >= 5
            ) return;

            pts.push(
                svgPoint(e)
            );

            render();

        }
    );


    clearBtn.addEventListener(
        'click',
        function () {

            if (animating) return;

            pts = [];

            resetPose();

            log.innerHTML =
                '<span class="dim">' +
                'planner idle — waiting for waypoints' +
                '</span>';

            render();

        }
    );


    toggle.querySelectorAll('button')
        .forEach(
            function (btn) {

                btn.addEventListener(
                    'click',
                    function () {

                        if (animating) return;

                        mode =
                            btn.getAttribute(
                                'data-mode'
                            );

                        toggle.querySelectorAll('button')
                            .forEach(
                                function (b) {
                                    b.classList.toggle(
                                        'active',
                                        b === btn
                                    );
                                }
                            );

                        rtEl.textContent =
                            mode === 'diff'
                                ? '"two_wheel"'
                                : '"four_wheel_mecanum"';

                        cmsEl.textContent =
                            mode === 'diff'
                                ? 'false'
                                : 'true';

                        tsEl.textContent =
                            mode === 'diff'
                                ? 'rotate-then-drive'
                                : 'strafe-direct';

                        modeSub.textContent =
                            'parameter in play: can_move_sideways = ' +
                            (mode === 'diff'
                                ? 'false'
                                : 'true');

                        buildRobot();

                    }
                );

            }
        );


    runBtn.addEventListener(
        'click',
        function () {

            if (
                animating ||
                pts.length < 1
            ) return;

            animating = true;

            runBtn.disabled = true;
            clearBtn.disabled = true;

            toggle.querySelectorAll('button')
                .forEach(
                    function (b) {
                        b.disabled = true;
                    }
                );


            resetPose();

            trailD =
                'M' +
                st.x.toFixed(1) +
                ' ' +
                st.y.toFixed(1);


            let wp = 0,
                phase = 'rotate',
                last = null,
                lastLog = 0;


            function finish() {

                animating = false;

                clearBtn.disabled = false;

                toggle.querySelectorAll('button')
                    .forEach(
                        function (b) {
                            b.disabled = false;
                        }
                    );

                caption.textContent =
                    'goal reached — planner idle';

                log.innerHTML =
                    '<span class="dim">' +
                    'planner idle — path complete. wheels stopped.' +
                    '</span>';

                render();

            }


            function frame(now) {

                if (last === null) {
                    last = now;
                }

                const dt =
                    Math.min(
                        (now - last) / 1000,
                        0.05
                    );

                last = now;


                const tgt = pts[wp];

                const dx =
                    tgt.x - st.x;

                const dy =
                    tgt.y - st.y;

                const dpx =
                    Math.hypot(dx,dy);

                const dm =
                    dpx / PXM;


                if (dpx < 2.5) {

                    wp++;

                    phase = 'rotate';

                    if (wp >= pts.length) {
                        finish();
                        return;
                    }

                    requestAnimationFrame(frame);
                    return;

                }


                let v = 0,
                    vy = 0,
                    wRos = 0,
                    wheels,
                    html = '';


                if (mode === 'diff') {

                    const a =
                        Math.atan2(dy,dx);

                    const err =
                        shortestDelta(
                            st.h,
                            a
                        );


                    if (
                        phase === 'rotate' &&
                        Math.abs(err) < 0.04
                    ) {
                        phase = 'drive';
                    }


                    if (phase === 'rotate') {

                        let ws =
                            clamp(
                                3.2 * err,
                                -2.4,
                                2.4
                            );

                        if (
                            Math.abs(ws) < 0.35
                        ) {
                            ws =
                                0.35 *
                                (err >= 0 ? 1 : -1);
                        }

                        st.h +=
                            ws * dt;

                        wRos = -ws;

                        caption.textContent =
                            'waypoint ' +
                            (wp + 1) +
                            ': rotating to face it';

                    } else {

                        v =
                            clamp(
                                dm * 2.2,
                                0.04,
                                VMAX
                            );

                        const ws =
                            clamp(
                                2.5 * err,
                                -1,
                                1
                            );

                        st.h +=
                            ws * dt;

                        wRos = -ws;

                        st.x +=
                            Math.cos(st.h) *
                            v *
                            PXM *
                            dt;

                        st.y +=
                            Math.sin(st.h) *
                            v *
                            PXM *
                            dt;

                        caption.textContent =
                            'waypoint ' +
                            (wp + 1) +
                            ': driving straight to it';

                    }


                    wheels =
                        diffSpeeds(
                            v,
                            wRos
                        );


                    html =
                        'velocity command: <b>vx=' +
                        v.toFixed(2) +
                        '</b> ω=' +
                        signed(
                            wRos * 180 / Math.PI,
                            0
                        ) +
                        '°/s<br>kinematics → wheels: L=' +
                        signed(wheels[0],1) +
                        ' R=' +
                        signed(wheels[1],1) +
                        ' rad/s<br><span class="dim">' +
                        (
                            phase === 'rotate'
                                ? 'diff-drive: no lateral velocity available'
                                : 'heading controlled toward target'
                        ) +
                        '</span>';


                } else {

                    const ux =
                        dx / dpx;

                    const uy =
                        dy / dpx;

                    const sp =
                        clamp(
                            dm * 2.2,
                            0.04,
                            VMAX
                        );

                    const wvx =
                        ux * sp;

                    const wvy =
                        uy * sp;


                    st.x +=
                        wvx *
                        PXM *
                        dt;

                    st.y +=
                        wvy *
                        PXM *
                        dt;


                    v =
                        wvx *
                        Math.cos(st.h) +
                        wvy *
                        Math.sin(st.h);

                    vy =
                        wvx *
                        Math.sin(st.h) -
                        wvy *
                        Math.cos(st.h);


                    wheels =
                        mecSpeeds(
                            v,
                            vy,
                            0
                        );


                    caption.textContent =
                        'waypoint ' +
                        (wp + 1) +
                        ': strafing straight at it, no turning';


                    html =
                        'velocity command: <b>vx=' +
                        signed(v,2) +
                        ' vy=' +
                        signed(vy,2) +
                        '</b> ω=0°/s<br>kinematics → wheels: FL=' +
                        signed(wheels[0],1) +
                        ' FR=' +
                        signed(wheels[1],1) +
                        '<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;RL=' +
                        signed(wheels[2],1) +
                        ' RR=' +
                        signed(wheels[3],1) +
                        ' rad/s<br><span class="dim">' +
                        'mecanum drive: lateral velocity is available' +
                        '</span>';

                }


                for (
                    let i = 0;
                    i < wheels.length;
                    i++
                ) {

                    st.ph[i] +=
                        wheels[i] *
                        dt *
                        RU;

                }


                robot.setPose(
                    st.x,
                    st.y,
                    st.h
                );

                robot.setPhases(
                    st.ph
                );


                trailD +=
                    ' L' +
                    st.x.toFixed(1) +
                    ' ' +
                    st.y.toFixed(1);

                trailEl.setAttribute(
                    'd',
                    trailD
                );


                if (
                    now - lastLog > 90
                ) {

                    log.innerHTML = html;

                    lastLog = now;

                }


                requestAnimationFrame(frame);

            }


            requestAnimationFrame(frame);

        }
    );


    buildRobot();
    render();

})();


/* ==================================================================
   SECTION 04: VELOCITY CONSOLE
   ================================================================== */

(function () {

    const toggle = $('drive-toggle'),
          layer = $('drive-robot-layer'),
          trailEl = $('drive-trail'),
          caption = $('drive-caption');

    const sVx = $('s-vx'),
          sVy = $('s-vy'),
          sW = $('s-w'),
          vVx = $('v-vx'),
          vVy = $('v-vy'),
          vW = $('v-w');

    const ctrlVy = $('ctrl-vy'),
          vyLock = $('vy-lock'),
          paramRows = $('drive-param-rows'),
          wheelRows = $('drive-wheels'),
          stage = $('drive-stage');

    const S = 1.3,
          PXM = UPM * S;

    let mode = 'diff',
        robot = null,
        trail = [],
        visible = true,
        wheelEls = [],
        lastUi = 0;


    const st = {
        x: 150,
        y: 110,
        h: 0,
        ph: [0,0,0,0]
    };


    function names() {

        return mode === 'diff'
            ? [
                'wheel_left',
                'wheel_right'
            ]
            : [
                'wheel_front_left',
                'wheel_front_right',
                'wheel_rear_left',
                'wheel_rear_right'
            ];

    }


    function buildRobot() {

        layer.innerHTML = '';

        robot =
            makeRobot(
                mode,
                layer,
                S
            );

        st.ph =
            [0,0,0,0];

        robot.setPose(
            st.x,
            st.y,
            st.h
        );


        paramRows.innerHTML =
            '<div class="np-param-row">' +
            '<span class="k">wheel_radius</span>' +
            '<span class="v">0.033 m</span>' +
            '</div>' +

            (
                mode === 'diff'
                    ?
                    '<div class="np-param-row">' +
                    '<span class="k">wheel_separation</span>' +
                    '<span class="v">0.14 m</span>' +
                    '</div>'

                    :

                    '<div class="np-param-row">' +
                    '<span class="k">wheel_lx_plus_ly</span>' +
                    '<span class="v">0.109 m</span>' +
                    '</div>'
            );


        wheelRows.innerHTML =
            names()
                .map(
                    function (n) {

                        return (
                            '<div class="np-param-row">' +
                            '<span class="k">' +
                            n +
                            '</span>' +
                            '<span class="v">0.0 rad/s</span>' +
                            '</div>'
                        );

                    }
                )
                .join('');


        wheelEls =
            Array.prototype.slice.call(
                wheelRows.querySelectorAll('.v')
            );

    }


    function readVals() {

        const canSide =
            mode === 'mec';

        const vx =
            (+sVx.value) / 100;

        const vy =
            canSide
                ? (+sVy.value) / 100
                : 0;

        const w =
            (+sW.value) *
            Math.PI /
            180;


        vVx.textContent =
            vx.toFixed(2) +
            ' m/s';

        vVy.textContent =
            vy.toFixed(2) +
            ' m/s';

        vW.textContent =
            Math.round(+sW.value) +
            ' °/s';


        ctrlVy.classList.toggle(
            'disabled',
            !canSide
        );

        vyLock.style.display =
            canSide
                ? 'none'
                : 'inline-block';


        const moving =
            Math.abs(vx) > 0.01 ||
            Math.abs(vy) > 0.01 ||
            Math.abs(w) > 0.02;


        caption.textContent =
            !moving
                ? 'stopped'

                :

                (
                    Math.abs(vy) > 0.02 &&
                    canSide
                )

                    ?
                    'strafing sideways'

                    :

                    (
                        Math.abs(vx) > 0.02
                            ?
                            (
                                vx > 0
                                    ? 'driving forward'
                                    : 'reversing'
                            )

                            :

                            'spinning in place'
                    );


        return {
            vx: vx,
            vy: vy,
            w: w
        };

    }


    [sVx,sVy,sW].forEach(
        function (el) {

            el.addEventListener(
                'input',
                readVals
            );

        }
    );


    toggle.querySelectorAll('button')
        .forEach(
            function (btn) {

                btn.addEventListener(
                    'click',
                    function () {

                        mode =
                            btn.getAttribute(
                                'data-mode'
                            );


                        toggle.querySelectorAll('button')
                            .forEach(
                                function (b) {

                                    b.classList.toggle(
                                        'active',
                                        b === btn
                                    );

                                }
                            );


                        if (mode === 'diff') {
                            sVy.value = 0;
                        }


                        buildRobot();
                        readVals();

                    }
                );

            }
        );


    shadow.querySelectorAll(
        '[data-preset]'
    ).forEach(
        function (btn) {

            btn.addEventListener(
                'click',
                function () {

                    const p =
                        btn.getAttribute(
                            'data-preset'
                        );


                    if (p === 'fwd') {

                        sVx.value = 20;
                        sVy.value = 0;
                        sW.value = 0;

                    }


                    if (p === 'rev') {

                        sVx.value = -18;
                        sVy.value = 0;
                        sW.value = 0;

                    }


                    if (p === 'strafe') {

                        sVx.value = 0;

                        sVy.value =
                            mode === 'mec'
                                ? 20
                                : 0;

                        sW.value = 0;

                    }


                    if (p === 'spin') {

                        sVx.value = 0;
                        sVy.value = 0;
                        sW.value = 70;

                    }


                    if (p === 'stop') {

                        sVx.value = 0;
                        sVy.value = 0;
                        sW.value = 0;

                    }


                    readVals();

                }
            );

        }
    );


    $('drive-reset')
        .addEventListener(
            'click',
            function () {

                st.x = 150;
                st.y = 110;
                st.h = 0;

                trail = [];

                trailEl.setAttribute(
                    'd',
                    ''
                );

                robot.setPose(
                    st.x,
                    st.y,
                    st.h
                );

            }
        );


    if (
        typeof IntersectionObserver !==
        'undefined'
    ) {

        new IntersectionObserver(
            function (es) {

                visible =
                    es[0].isIntersecting;

            }
        ).observe(stage);

    }


    let last = null;


    function loop(now) {

        if (last === null) {
            last = now;
        }


        const dt =
            Math.min(
                (now - last) / 1000,
                0.05
            );


        last = now;


        if (visible) {

            const c =
                readVals();


            st.h -=
                c.w * dt;


            const dx =
                (
                    c.vx * Math.cos(st.h) +
                    c.vy * Math.sin(st.h)
                ) *
                PXM *
                dt;


            const dy =
                (
                    c.vx * Math.sin(st.h) -
                    c.vy * Math.cos(st.h)
                ) *
                PXM *
                dt;


            st.x += dx;
            st.y += dy;


            let brk = false;


            if (st.x < -14) {

                st.x += 328;
                brk = true;

            } else if (st.x > 314) {

                st.x -= 328;
                brk = true;

            }


            if (st.y < -14) {

                st.y += 248;
                brk = true;

            } else if (st.y > 234) {

                st.y -= 248;
                brk = true;

            }


            const ws =
                mode === 'diff'
                    ? diffSpeeds(
                        c.vx,
                        c.w
                    )
                    : mecSpeeds(
                        c.vx,
                        c.vy,
                        c.w
                    );


            for (
                let i = 0;
                i < ws.length;
                i++
            ) {

                st.ph[i] +=
                    ws[i] *
                    dt *
                    RU;

            }


            robot.setPose(
                st.x,
                st.y,
                st.h
            );

            robot.setPhases(
                st.ph
            );


            if (
                Math.abs(dx) +
                Math.abs(dy) >
                0.05 ||
                brk
            ) {

                trail.push([
                    st.x,
                    st.y,
                    brk
                ]);


                if (
                    trail.length >
                    600
                ) {
                    trail.shift();
                }


                trailEl.setAttribute(
                    'd',
                    trail
                        .map(
                            function (p,i) {

                                return (
                                    (
                                        i === 0 ||
                                        p[2]
                                    )
                                        ? 'M'
                                        : 'L'
                                ) +

                                p[0].toFixed(1) +
                                ' ' +
                                p[1].toFixed(1);

                            }
                        )
                        .join(' ')
                );

            }


            if (
                now - lastUi >
                100
            ) {

                lastUi = now;


                for (
                    let i = 0;
                    i < ws.length;
                    i++
                ) {

                    if (wheelEls[i]) {

                        wheelEls[i].textContent =
                            signed(
                                ws[i],
                                1
                            ) +
                            ' rad/s';

                    }

                }

            }

        }


        requestAnimationFrame(
            loop
        );

    }


    buildRobot();

    readVals();

    requestAnimationFrame(loop);

})();


/* ==================================================================
   SECTION 05: OBSTACLE AVOIDANCE
   ================================================================== */

(function () {

    const toggle = $('oa-toggle'),
          layer = $('oa-robot-layer'),
          bubble = $('oa-margin'),
          caption = $('oa-caption');

    const runBtn = $('oa-run'),
          resetBtn = $('oa-reset'),
          log = $('oa-log'),
          sub = $('oa-sub');

    const fpEl = $('oa-fp'),
          marginEl = $('oa-margin-val'),
          stopEl = $('oa-stop-val'),
          ray = $('oa-ray'),
          distTxt = $('oa-dist');

    const PXM = 140,
          OBS_X = 236,
          START_X = 100,
          Y = 110;


    const presets = {

        small: {
            footprint: 0.20,
            margin: 0.12
        },

        large: {
            footprint: 0.55,
            margin: 0.35
        }

    };


    let mode = 'small',
        animating = false,
        robot = null,
        s = 1;


    const ph = [0,0];


    function stopM(p) {

        return p.footprint / 2 +
               p.margin;

    }


    function build() {

        const p =
            presets[mode];


        s =
            p.footprint *
            PXM /
            44;


        layer.innerHTML = '';


        robot =
            makeRobot(
                'diff',
                layer,
                s
            );


        fpEl.textContent =
            p.footprint.toFixed(2) +
            ' m';


        marginEl.textContent =
            p.margin.toFixed(2) +
            ' m';


        stopEl.textContent =
            stopM(p).toFixed(2) +
            ' m';


        sub.textContent =
            'parameter in play: safety_margin = ' +
            p.margin.toFixed(2) +
            ' m';


        bubble.setAttribute(
            'r',
            (
                stopM(p) *
                PXM
            ).toFixed(1)
        );


        place(
            START_X,
            0
        );


        caption.textContent =
            'press Approach to drive toward the obstacle';


        log.innerHTML =
            '<span class="dim">' +
            'idle — waiting to approach' +
            '</span>';

    }


    function place(x,v) {

        robot.setPose(
            x,
            Y,
            0
        );


        robot.setPhases([
            ph[0],
            ph[0]
        ]);


        bubble.setAttribute(
            'cx',
            x.toFixed(1)
        );


        bubble.setAttribute(
            'cy',
            Y
        );


        const front =
            x +
            22 *
            s;


        ray.setAttribute(
            'x1',
            front.toFixed(1)
        );


        ray.setAttribute(
            'y1',
            Y
        );


        distTxt.setAttribute(
            'x',
            (
                (
                    front +
                    OBS_X
                ) / 2
            ).toFixed(1)
        );


        distTxt.textContent =
            (
                (
                    OBS_X -
                    front
                ) / PXM
            ).toFixed(2) +
            ' m';

    }


    toggle.querySelectorAll('button')
        .forEach(
            function (btn) {

                btn.addEventListener(
                    'click',
                    function () {

                        if (animating) return;

                        mode =
                            btn.getAttribute(
                                'data-mode'
                            );


                        toggle.querySelectorAll('button')
                            .forEach(
                                function (b) {

                                    b.classList.toggle(
                                        'active',
                                        b === btn
                                    );

                                }
                            );


                        ph[0] = 0;

                        build();

                    }
                );

            }
        );


    resetBtn.addEventListener(
        'click',
        function () {

            if (!animating) {

                ph[0] = 0;

                build();

            }

        }
    );


    runBtn.addEventListener(
        'click',
        function () {

            if (animating) return;

            animating = true;

            runBtn.disabled = true;


            toggle.querySelectorAll('button')
                .forEach(
                    function (b) {
                        b.disabled = true;
                    }
                );


            ph[0] = 0;

            build();


            const p =
                presets[mode];


            const stopPx =
                stopM(p) *
                PXM;


            const targetX =
                OBS_X -
                stopPx;


            const VMAX =
                0.45 *
                PXM;


            const A =
                0.9 *
                PXM;


            let x = START_X,
                v = 0,
                last = null,
                lastLog = 0;


            caption.textContent =
                'driving forward — watching stop_distance';


            function frame(now) {

                if (last === null) {
                    last = now;
                }


                const dt =
                    Math.min(
                        (now - last) /
                        1000,
                        0.05
                    );


                last = now;


                const rem =
                    targetX -
                    x;


                if (rem <= 0.4) {

                    x =
                        targetX;


                    place(
                        x,
                        0
                    );


                    animating = false;

                    runBtn.disabled = false;


                    toggle.querySelectorAll('button')
                        .forEach(
                            function (b) {
                                b.disabled = false;
                            }
                        );


                    caption.textContent =
                        'stopped — safety_margin reached (' +
                        p.margin.toFixed(2) +
                        ' m clear)';


                    log.innerHTML =
                        'cmd: <b>vx=0.00</b><br>' +
                        '<span class="dim">' +
                        'obstacle within safety_margin — halted' +
                        '</span>';


                    return;

                }


                v =
                    Math.min(
                        v + A * dt,
                        VMAX,
                        Math.sqrt(
                            2 *
                            A *
                            rem
                        )
                    );


                x +=
                    v *
                    dt;


                ph[0] +=
                    v *
                    dt /
                    s;


                place(
                    x,
                    v
                );


                if (
                    now - lastLog >
                    90
                ) {

                    lastLog = now;


                    log.innerHTML =
                        'cmd: <b>vx=' +
                        (
                            v / PXM
                        ).toFixed(2) +
                        ' m/s</b><br>' +

                        'gap to obstacle: ' +
                        (
                            (
                                OBS_X -
                                (
                                    x +
                                    22 *
                                    s
                                )
                            ) /
                            PXM
                        ).toFixed(2) +
                        ' m<br>' +

                        '<span class="dim">' +
                        'braking so it stops at stop_distance = ' +
                        stopM(p).toFixed(2) +
                        ' m' +
                        '</span>';

                }


                requestAnimationFrame(
                    frame
                );

            }


            requestAnimationFrame(
                frame
            );

        }
    );


    build();

})();

})();
</script>

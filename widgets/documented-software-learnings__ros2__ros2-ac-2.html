<script data-wp-block-html="js">
/* ============ Section 01: physics sandbox ============ */
(function(){
  var canvas=document.getElementById('phys-canvas'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,floorY=H-20;
  var gI=document.getElementById('phys-gravity'),bI=document.getElementById('phys-bounce'),fI=document.getElementById('phys-friction');
  var gv=document.getElementById('phys-gval'),bv=document.getElementById('phys-bval'),fv=document.getElementById('phys-fval');
  var balls=[],colors=['#ffc857','#b18cff','#7dc4ff','#ff9ecb','#5eead4'];
  gI.addEventListener('input',function(){gv.textContent=gI.value;});
  bI.addEventListener('input',function(){bv.textContent=bI.value+'%';});
  fI.addEventListener('input',function(){fv.textContent=fI.value+'%';});
  function addBall(){
    balls.push({x:60+Math.random()*(W-120),y:30,vx:(Math.random()-0.5)*3,vy:0,r:12+Math.random()*8,color:colors[balls.length%colors.length]});
    if(balls.length>12)balls.shift();
  }
  function step(){
    var g=(+gI.value)/90,e=(+bI.value)/100,fr=1-((+fI.value)/100)*0.1;
    ctx.fillStyle='#0b0819';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#2a244d';ctx.beginPath();ctx.moveTo(0,floorY+1);ctx.lineTo(W,floorY+1);ctx.stroke();
    balls.forEach(function(b){
      b.vy+=g;b.x+=b.vx;b.y+=b.vy;
      if(b.x-b.r<0){b.x=b.r;b.vx*=-1;}
      if(b.x+b.r>W){b.x=W-b.r;b.vx*=-1;}
      if(b.y+b.r>floorY){b.y=floorY-b.r;b.vy=-b.vy*e;b.vx*=fr;}
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=b.color;ctx.fill();
    });
    requestAnimationFrame(step);
  }
  document.getElementById('phys-drop').addEventListener('click',addBall);
  document.getElementById('phys-clear').addEventListener('click',function(){balls=[];});
  addBall();requestAnimationFrame(step);
})();

/* ============ Section 02: real vs sim, same topic ============ */
(function(){
  var toggle=document.getElementById('rvs-toggle'),badge=document.getElementById('rvs-badge'),note=document.getElementById('rvs-note');
  var accelOut=document.getElementById('rvs-accel'),tiltOut=document.getElementById('rvs-tilt');
  var sc=document.getElementById('rvs-canvas'),sx=sc.getContext('2d'),cc=document.getElementById('rvs-consumer-canvas'),cx=cc.getContext('2d');
  var source='real',t0=performance.now();
  function drawTilt(c,w,h,deg,color){
    c.clearRect(0,0,w,h);c.save();c.translate(w/2,h/2);c.rotate(deg*Math.PI/180);
    c.fillStyle=color;c.fillRect(-26,-14,52,28);c.strokeStyle='#110d22';c.lineWidth=1.5;c.strokeRect(-26,-14,52,28);
    c.beginPath();c.moveTo(0,-14);c.lineTo(0,-22);c.strokeStyle=color;c.stroke();c.restore();
  }
  function frame(ts){
    var t=(ts-t0)/1000,ang=Math.sin(t*1.1)*22,acc=9.8+Math.sin(t*2.3)*0.6;
    accelOut.textContent=acc.toFixed(2);tiltOut.textContent=ang.toFixed(0);
    drawTilt(sx,sc.width,sc.height,ang,source==='real'?'#ff6b6b':'#b18cff');
    drawTilt(cx,cc.width,cc.height,ang,'#ffc857');
    requestAnimationFrame(frame);
  }
  toggle.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click',function(){
      source=btn.dataset.src;
      toggle.querySelectorAll('button').forEach(function(b){b.classList.toggle('active',b===btn);});
      badge.textContent=source==='real'?'REAL HARDWARE':'GAZEBO SIMULATION';
      badge.className='gz-source-badge '+(source==='real'?'real':'sim');
      note.textContent=source==='real'?'Reading from /imu/data, published by the physical IMU':'Reading from /imu/data, published by Gazebo instead';
    });
  });
  requestAnimationFrame(frame);
})();

/* ============ Section 03: world, differential drive, A* navigation, lidar, map, topics ============ */
(function(){
  var $=function(i){return document.getElementById(i);};
  var canvas=$('world-canvas'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,cols=14,rows=8,cell=W/cols;
  var lc=$('world-lidar-canvas'),lx=lc.getContext('2d'),LW=lc.width;
  var speedIn=$('world-speed'),inertIn=$('world-momentum'),baseIn=$('world-base'),fricIn=$('world-fric'),noiseIn=$('world-noise'),beamIn=$('world-beams');
  var palette=$('world-palette'),dpad=$('world-dpad'),modeToggle=$('mode-toggle'),tele=$('world-telemetry'),lidarOut=$('world-lidar-readout');
  var mc=$('map-canvas'),mx=mc.getContext('2d'),mapOut=$('map-readout'),topicPre=$('topic-pre'),poseBtn=$('map-pose'),loopBtn=$('wp-loop');
  var tool='wall',grid={},robot=null,goal=null,goals=[],wpIdx=0,loopWp=false,gridVer=0,mode='manual',painting=false;
  var held={up:0,down:0,left:0,right:0},cmd={v:0,w:0},t0=performance.now();
  var R=0.3,RANGE=6,trail=[],path=[],pathIdx=0,navState='idle',planVer=-1,stuckT=0,stuckPos=null,scan=[],sweep=0,frameN=0,hitLast=false;
  var COL={wall:'#9d97c4',house:'#ff9ecb',obstacle:'#ff6b6b'},LAB={wall:'W',house:'F',obstacle:'O'};
  var TAU=Math.PI*2;
  /* occupancy grid: 4x4 sub-cells per tile, log-odds */
  var MS=4,MW=cols*MS,MH=rows*MS,LO=new Float32Array(MW*MH),mapPose='truth';
  function resetMap(){LO=new Float32Array(MW*MH);}

  function key(x,y){return x+','+y;}
  function isBlocked(x,y){if(x<0||y<0||x>=cols||y>=rows)return true;return !!grid[key(x,y)];}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function angDiff(a,b){var d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;}
  function gauss(){return Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(TAU*Math.random());}
  function goalAt(cx,cy){for(var i=0;i<goals.length;i++)if(goals[i].cx===cx&&goals[i].cy===cy)return i;return -1;}

  /* slider labels */
  [[speedIn,'world-speed-val',function(v){return v;}],[inertIn,'world-momentum-val',function(v){return v+'%';}],
   [baseIn,'world-base-val',function(v){return (v/100).toFixed(2);}],[fricIn,'world-fric-val',function(v){return v+'%';}],
   [noiseIn,'world-noise-val',function(v){return v;}],[beamIn,'world-beams-val',function(v){return v;}]].forEach(function(s){
    s[0].addEventListener('input',function(){$(s[1]).textContent=s[2](s[0].value);});
  });

  /* circle vs blocked cells; returns corrected position */
  function push(x,y,r){
    var hit=false;
    for(var pass=0;pass<2;pass++){
      for(var cy=Math.floor(y)-1;cy<=Math.floor(y)+1;cy++)for(var cx=Math.floor(x)-1;cx<=Math.floor(x)+1;cx++){
        if(!isBlocked(cx,cy))continue;
        var qx=clamp(x,cx,cx+1),qy=clamp(y,cy,cy+1),dx=x-qx,dy=y-qy,d=Math.sqrt(dx*dx+dy*dy);
        if(d<r){hit=true;if(d>1e-6){x=qx+dx/d*r;y=qy+dy/d*r;}else{y-=r;}}
      }
    }
    return {x:x,y:y,hit:hit};
  }

  /* exact grid raycast (DDA); returns distance or Infinity */
  function cast(ox,oy,a,maxR){
    var dx=Math.cos(a),dy=Math.sin(a),mx2=Math.floor(ox),my=Math.floor(oy);
    if(isBlocked(mx2,my))return 0;
    var sx=dx>0?1:-1,sy=dy>0?1:-1,tdx=dx===0?Infinity:Math.abs(1/dx),tdy=dy===0?Infinity:Math.abs(1/dy);
    var tmx=dx===0?Infinity:(dx>0?(mx2+1-ox):(ox-mx2))*tdx,tmy=dy===0?Infinity:(dy>0?(my+1-oy):(oy-my))*tdy,t=0;
    while(t<maxR){
      if(tmx<tmy){mx2+=sx;t=tmx;tmx+=tdx;}else{my+=sy;t=tmy;tmy+=tdy;}
      if(isBlocked(mx2,my))return t<=maxR?t:Infinity;
    }
    return Infinity;
  }

  function doScan(){
    var N=+beamIn.value,sg=(+noiseIn.value)*0.01;scan=[];
    for(var i=0;i<N;i++){
      var a=-Math.PI+i*TAU/N,r=cast(robot.x,robot.y,robot.th+a,RANGE);
      if(r<RANGE){r=Math.max(0.05,r+gauss()*sg*(0.3+r/RANGE));if(r>=RANGE)r=Infinity;}else r=Infinity;
      scan.push({a:a,r:r});
    }
  }
  function sectorMin(c,h){var m=Infinity;for(var i=0;i<scan.length;i++){if(Math.abs(angDiff(scan[i].a,c))<=h&&scan[i].r<m)m=scan[i].r;}return m;}

  /* ---- occupancy grid update from the scan ---- */
  function updateMap(){
    if(!robot||!scan.length)return;
    var p=mapPose==='truth'?{x:robot.x,y:robot.y,th:robot.th}:odom;
    scan.forEach(function(s){
      var hit=isFinite(s.r),r=hit?s.r:RANGE,a=p.th+s.a,dx=Math.cos(a),dy=Math.sin(a);
      for(var d=0;d<r-0.1;d+=0.1){
        var ix=Math.floor((p.x+dx*d)*MS),iy=Math.floor((p.y+dy*d)*MS);
        if(ix<0||iy<0||ix>=MW||iy>=MH)break;
        var i=iy*MW+ix;LO[i]=Math.max(-4,LO[i]-0.15);
      }
      if(hit){
        var hx=Math.floor((p.x+dx*r)*MS),hy=Math.floor((p.y+dy*r)*MS);
        if(hx>=0&&hy>=0&&hx<MW&&hy<MH){var j=hy*MW+hx;LO[j]=Math.min(6,LO[j]+0.8);}
      }
    });
  }
  function drawMap(){
    var c=mc.width/MW;
    mx.fillStyle='#0b0819';mx.fillRect(0,0,mc.width,mc.height);
    mx.fillStyle='#171232';mx.fillRect(0,0,mc.width,mc.height);
    for(var y=0;y<MH;y++)for(var x=0;x<MW;x++){
      var v=LO[y*MW+x];if(v>-0.3&&v<0.3)continue;
      mx.fillStyle=v<0?'rgba(177,140,255,'+Math.min(0.45,0.1-v*0.1).toFixed(2)+')':'rgba(255,200,87,'+Math.min(1,0.4+v*0.12).toFixed(2)+')';
      mx.fillRect(x*c,y*c,c,c);
    }
    if(robot){
      var p=mapPose==='truth'?{x:robot.x,y:robot.y,th:robot.th}:odom,px=p.x*MS*c,py=p.y*MS*c;
      mx.save();mx.translate(px,py);mx.rotate(p.th);mx.beginPath();mx.moveTo(8,0);mx.lineTo(-5,-5);mx.lineTo(-5,5);mx.closePath();mx.fillStyle='#e9e5fa';mx.fill();mx.restore();
    }
  }

  /* ---- A* planner + line-of-sight smoothing ---- */
  function near(cx,cy){var n=0;for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){if((dx||dy)&&isBlocked(cx+dx,cy+dy))n++;}return n;}
  function los(a,b){
    var d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.ceil(d/0.08);
    for(var i=0;i<=n;i++){var t=i/n;if(push(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,R+0.08).hit)return false;}
    return true;
  }
  function plan(){
    planVer=gridVer;path=[];pathIdx=0;stuckPos=null;stuckT=0;
    var sx=Math.floor(robot.x),sy=Math.floor(robot.y),gx=goal.cx,gy=goal.cy;
    if(isBlocked(gx,gy)){navState='no path';return;}
    var gs={},from={},closed={},open=[],sk=key(sx,sy),found=false;
    var hh=function(x,y){return Math.hypot(x-gx,y-gy);};
    gs[sk]=0;open.push([hh(sx,sy),sx,sy]);
    while(open.length){
      var bi=0;for(var i=1;i<open.length;i++)if(open[i][0]<open[bi][0])bi=i;
      var cur=open.splice(bi,1)[0],cx=cur[1],cy=cur[2],ck=key(cx,cy);
      if(closed[ck])continue;closed[ck]=1;
      if(cx===gx&&cy===gy){found=true;break;}
      for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){
        if(!dx&&!dy)continue;
        var nx=cx+dx,ny=cy+dy;
        if(isBlocked(nx,ny))continue;
        if(dx&&dy&&(isBlocked(cx+dx,cy)||isBlocked(cx,cy+dy)))continue;
        var nk=key(nx,ny);if(closed[nk])continue;
        var c=gs[ck]+(dx&&dy?1.414:1)+near(nx,ny)*0.5;
        if(gs[nk]===undefined||c<gs[nk]){gs[nk]=c;from[nk]=ck;open.push([c+hh(nx,ny),nx,ny]);}
      }
    }
    if(!found){navState='no path';return;}
    var cells=[],k=key(gx,gy);
    while(k!==sk){var p=k.split(',');cells.unshift([+p[0]+0.5,+p[1]+0.5]);k=from[k];}
    var pts=[[robot.x,robot.y]].concat(cells),out=[],i2=0;
    while(i2<pts.length-1){var j=pts.length-1;while(j>i2+1&&!los(pts[i2],pts[j]))j--;out.push(pts[j]);i2=j;}
    if(!out.length)out=[[gx+0.5,gy+0.5]];
    path=out;navState='following';
  }

  /* ---- waypoint sequencing ---- */
  function advanceWaypoint(){
    if(wpIdx<goals.length-1)wpIdx++;
    else if(loopWp&&goals.length>1)wpIdx=0;
    else{navState='arrived';return;}
    goal=goals[wpIdx];planVer=-1;
  }

  /* ---- pure pursuit -> wheel speeds ---- */
  function autoDrive(vmax,base,dt){
    if(!goal){navState='no goal';return [0,0];}
    if(planVer!==gridVer)plan();
    if(navState==='no path'||navState==='arrived')return [0,0];
    while(pathIdx<path.length-1&&Math.hypot(path[pathIdx][0]-robot.x,path[pathIdx][1]-robot.y)<0.45)pathIdx++;
    var tg=path[pathIdx],dx=tg[0]-robot.x,dy=tg[1]-robot.y,d=Math.hypot(dx,dy);
    if(pathIdx===path.length-1&&d<0.12){advanceWaypoint();return [0,0];}
    navState='following';
    stuckT+=dt;
    if(stuckT>2){if(stuckPos&&Math.hypot(robot.x-stuckPos[0],robot.y-stuckPos[1])<0.12)planVer=-1;stuckPos=[robot.x,robot.y];stuckT=0;}
    var err=angDiff(Math.atan2(dy,dx),robot.th);
    var v=vmax*Math.max(0,1-Math.abs(err)/0.9)*Math.min(1,0.25+d);
    var front=sectorMin(0,0.45);
    v*=clamp((front-0.4)/1.2,0.2,1);
    var wmax=1.2*vmax/base,w=clamp(err*2.5,-wmax,wmax);
    /* omega = (vL - vR)/base, v = (vL + vR)/2 */
    var l=v+w*base/2,r=v-w*base/2,m=Math.max(1,Math.abs(l)/vmax,Math.abs(r)/vmax);
    return [l/m,r/m];
  }

  /* ---- differential drive physics ---- */
  var odom={x:0,y:0,th:0};
  function step(dt){
    var vmax=(+speedIn.value)*0.3,acc=14-(+inertIn.value)/100*12.5,base=(+baseIn.value)/100,resist=(+fricIn.value)/100*8;
    var tl=0,tr=0;
    if(mode==='manual'){
      var f=held.up-held.down,t=held.right-held.left;
      tl=f+t*0.7;tr=f-t*0.7;
      var m=Math.max(1,Math.abs(tl),Math.abs(tr));tl=tl/m*vmax;tr=tr/m*vmax;
    }else{var c=autoDrive(vmax,base,dt);tl=c[0];tr=c[1];}
    cmd.v=(tl+tr)/2;cmd.w=(tl-tr)/base;
    var a=acc*dt;
    robot.vL+=clamp(tl-robot.vL,-a,a);robot.vR+=clamp(tr-robot.vR,-a,a);
    var damp=1-resist*dt;robot.vL*=damp;robot.vR*=damp;
    var v=(robot.vL+robot.vR)/2,w=(robot.vL-robot.vR)/base;
    robot.v=v;robot.w=w;robot.th+=w*dt;
    var res=push(robot.x+Math.cos(robot.th)*v*dt,robot.y+Math.sin(robot.th)*v*dt,R);
    hitLast=res.hit;
    if(res.hit){robot.vL*=0.8;robot.vR*=0.8;}
    robot.x=res.x;robot.y=res.y;
    /* wheel odometry ignores collisions, so it drifts when the robot bumps into things */
    odom.th+=w*dt;odom.x+=Math.cos(odom.th)*v*dt;odom.y+=Math.sin(odom.th)*v*dt;
  }

  /* ---- drawing ---- */
  function drawWorld(ts){
    ctx.fillStyle='#0b0819';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
    for(var i=0;i<=cols;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,H);ctx.stroke();}
    for(var j=0;j<=rows;j++){ctx.beginPath();ctx.moveTo(0,j*cell);ctx.lineTo(W,j*cell);ctx.stroke();}
    Object.keys(grid).forEach(function(k){
      var p=k.split(','),cx=+p[0],cy=+p[1],item=grid[k];
      ctx.globalAlpha=0.85;ctx.fillStyle=COL[item];ctx.fillRect(cx*cell+2,cy*cell+2,cell-4,cell-4);ctx.globalAlpha=1;
      ctx.fillStyle='#110d22';ctx.font='bold 11px IBM Plex Mono, monospace';ctx.textAlign='center';ctx.fillText(LAB[item],cx*cell+cell/2,cy*cell+cell/2+4);
    });
    /* numbered waypoints; current one pulses */
    goals.forEach(function(g,gi){
      var gx=(g.cx+0.5)*cell,gy=(g.cy+0.5)*cell,cur=(gi===wpIdx),pr=cur?(Math.sin(ts/300)+1)*3:0;
      ctx.strokeStyle=cur?'#b18cff':'rgba(177,140,255,0.45)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(gx,gy,cell*0.3+pr,0,TAU);ctx.stroke();
      ctx.beginPath();ctx.arc(gx,gy,cell*0.16,0,TAU);ctx.fillStyle=cur?'#b18cff':'rgba(177,140,255,0.45)';ctx.fill();
      ctx.fillStyle='#110d22';ctx.font='bold 10px IBM Plex Mono, monospace';ctx.textAlign='center';ctx.fillText(gi+1,gx,gy+3.5);
    });
    if(!robot)return;
    /* trail */
    if(trail.length>1){ctx.beginPath();ctx.moveTo(trail[0][0]*cell,trail[0][1]*cell);for(var t=1;t<trail.length;t++)ctx.lineTo(trail[t][0]*cell,trail[t][1]*cell);ctx.strokeStyle='rgba(255,200,87,0.28)';ctx.lineWidth=1.5;ctx.stroke();}
    /* planned path */
    if(mode==='auto'&&path.length&&navState==='following'){
      ctx.setLineDash([5,4]);ctx.strokeStyle='rgba(177,140,255,0.9)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(robot.x*cell,robot.y*cell);
      for(var q=pathIdx;q<path.length;q++)ctx.lineTo(path[q][0]*cell,path[q][1]*cell);ctx.stroke();ctx.setLineDash([]);
      for(var q2=pathIdx;q2<path.length;q2++){ctx.beginPath();ctx.arc(path[q2][0]*cell,path[q2][1]*cell,2.5,0,TAU);ctx.fillStyle='#b18cff';ctx.fill();}
    }
    /* lidar fan + hits in world */
    if(scan.length){
      ctx.beginPath();ctx.moveTo(robot.x*cell,robot.y*cell);
      scan.forEach(function(s){var r=isFinite(s.r)?s.r:RANGE;ctx.lineTo((robot.x+Math.cos(robot.th+s.a)*r)*cell,(robot.y+Math.sin(robot.th+s.a)*r)*cell);});
      ctx.closePath();ctx.fillStyle='rgba(177,140,255,0.07)';ctx.fill();
      scan.forEach(function(s){if(!isFinite(s.r))return;ctx.beginPath();ctx.arc((robot.x+Math.cos(robot.th+s.a)*s.r)*cell,(robot.y+Math.sin(robot.th+s.a)*s.r)*cell,1.8,0,TAU);ctx.fillStyle='#ffc857';ctx.fill();});
    }
    /* robot body, wheels, heading */
    var base=(+baseIn.value)/100,rx=robot.x*cell,ry=robot.y*cell,rr=R*cell,wo=base/2*cell;
    ctx.save();ctx.translate(rx,ry);ctx.rotate(robot.th);
    ctx.beginPath();ctx.arc(0,0,rr,0,TAU);ctx.fillStyle=hitLast?'#ff6b6b':'#ffc857';ctx.fill();
    ctx.strokeStyle='#110d22';ctx.lineWidth=1.5;ctx.stroke();
    [[-wo,robot.vL],[wo,robot.vR]].forEach(function(wh){
      ctx.fillStyle=Math.abs(wh[1])<0.02?'#67618f':(wh[1]>0?'#b18cff':'#ff9ecb');
      ctx.fillRect(-rr*0.5,wh[0]-2.5,rr,5);
    });
    ctx.beginPath();ctx.moveTo(rr*0.95,0);ctx.lineTo(rr*0.35,-rr*0.35);ctx.lineTo(rr*0.35,rr*0.35);ctx.closePath();ctx.fillStyle='#110d22';ctx.fill();
    ctx.restore();
  }

  function fmt(r){return isFinite(r)?r.toFixed(2):'inf';}
  function drawLidar(){
    var cx=LW/2,cy=LW/2,sc=(LW/2-18)/RANGE;
    var P=function(a,r){return [cx+Math.sin(a)*r*sc,cy-Math.cos(a)*r*sc];};
    lx.fillStyle='#0b0819';lx.fillRect(0,0,LW,LW);
    lx.lineWidth=1;lx.font='9px IBM Plex Mono, monospace';lx.textAlign='left';
    for(var r=1;r<=RANGE;r++){
      lx.beginPath();lx.arc(cx,cy,r*sc,0,TAU);lx.strokeStyle=r%2?'rgba(255,255,255,0.04)':'rgba(255,255,255,0.10)';lx.stroke();
      if(r%2===0){lx.fillStyle='#67618f';lx.fillText(r+'m',cx+3,cy-r*sc-2);}
    }
    for(var k=0;k<12;k++){var ka=k*Math.PI/6,e=P(ka,RANGE);lx.beginPath();lx.moveTo(cx,cy);lx.lineTo(e[0],e[1]);lx.strokeStyle=k%3===0?'rgba(255,255,255,0.10)':'rgba(255,255,255,0.03)';lx.stroke();}
    lx.fillStyle='#67618f';lx.textAlign='center';lx.fillText('front',cx,10);lx.fillText('back',cx,LW-3);
    if(!robot||!scan.length){lx.fillStyle='#67618f';lx.fillText('no robot',cx,cy+30);return;}
    /* free space polygon */
    lx.beginPath();lx.moveTo(cx,cy);
    scan.forEach(function(s){var p=P(s.a,isFinite(s.r)?s.r:RANGE);lx.lineTo(p[0],p[1]);});
    lx.closePath();lx.fillStyle='rgba(177,140,255,0.08)';lx.fill();
    /* rotating sweep with fading trail */
    for(var s2=0;s2<16;s2++){var sp=P(sweep-s2*0.045,RANGE);lx.beginPath();lx.moveTo(cx,cy);lx.lineTo(sp[0],sp[1]);lx.strokeStyle='rgba(177,140,255,'+(0.30*(1-s2/16)).toFixed(3)+')';lx.stroke();}
    /* returns, colored by range */
    scan.forEach(function(s){
      if(!isFinite(s.r))return;
      var p=P(s.a,s.r);lx.beginPath();lx.arc(p[0],p[1],2.2,0,TAU);
      lx.fillStyle='hsl('+(45+(s.r/RANGE)*215).toFixed(0)+',90%,60%)';lx.fill();
    });
    /* robot marker */
    lx.beginPath();lx.moveTo(cx,cy-9);lx.lineTo(cx-6,cy+6);lx.lineTo(cx+6,cy+6);lx.closePath();lx.fillStyle='#b18cff';lx.fill();
  }

  function updateText(){
    if(!robot){tele.innerHTML='<span>Spawn a robot to start the simulation.</span>';topicPre.textContent='Spawn a robot to see its topics.';mapOut.textContent='Place a robot and drive to start mapping.';return;}
    var drift=Math.hypot(odom.x-robot.x,odom.y-robot.y);
    var st=mode==='manual'?'teleop':navState;
    tele.innerHTML=
      '<span>wheels L <b>'+robot.vL.toFixed(2)+'</b> R <b>'+robot.vR.toFixed(2)+'</b></span>'+
      '<span>v <b>'+robot.v.toFixed(2)+'</b> t/s &nbsp;&omega; <b>'+robot.w.toFixed(2)+'</b> r/s</span>'+
      '<span>pose <b>'+robot.x.toFixed(2)+', '+robot.y.toFixed(2)+'</b> &theta; <b>'+(angDiff(robot.th,0)*180/Math.PI).toFixed(0)+'&deg;</b></span>'+
      '<span>odom drift <b>'+drift.toFixed(2)+'</b> tiles</span>'+
      '<span>nav <b>'+st+'</b>'+(goal&&mode==='auto'?' &rarr; wp '+(wpIdx+1)+'/'+goals.length+' ('+goal.cx+','+goal.cy+')':'')+'</span>'+
      '<span>contact <b>'+(hitLast?'BUMP':'clear')+'</b></span>';
    if(!scan.length)return;
    var N=scan.length,ret=0,near2=Infinity;
    scan.forEach(function(s){if(isFinite(s.r)){ret++;if(s.r<near2)near2=s.r;}});
    var H2=Math.PI/2;
    lidarOut.innerHTML=
      'front <b>'+fmt(sectorMin(0,0.35))+'</b> &nbsp; right <b>'+fmt(sectorMin(H2,0.35))+'</b> &nbsp; back <b>'+fmt(sectorMin(Math.PI,0.35))+'</b> &nbsp; left <b>'+fmt(sectorMin(-H2,0.35))+'</b><br>'+
      'nearest <b>'+fmt(near2)+'</b> tiles &nbsp; returns <b>'+ret+' / '+N+'</b>'+
      '<div class="msg">sensor_msgs/LaserScan<br>angle_min: -3.142 &nbsp; angle_max: 3.142<br>angle_increment: '+(TAU/N).toFixed(4)+'<br>range_min: 0.05 &nbsp; range_max: '+RANGE.toFixed(1)+'<br>ranges[]: '+N+' floats &nbsp; noise: '+((+noiseIn.value)*0.01).toFixed(2)+' &nbsp; rate: 30 Hz</div>';
    /* map readout */
    var known=0,occ=0;for(var i=0;i<LO.length;i++){if(LO[i]>=0.3){known++;occ++;}else if(LO[i]<=-0.3)known++;}
    mapOut.innerHTML='explored <b>'+(known/LO.length*100).toFixed(0)+'%</b> &nbsp; occupied cells <b>'+occ+'</b><br>pose source <b>'+(mapPose==='truth'?'ground truth':'wheel odometry')+'</b>'+
      '<div class="msg">nav_msgs/OccupancyGrid<br>resolution: '+(1/MS).toFixed(2)+' tiles/cell<br>width: '+MW+' &nbsp; height: '+MH+'<br>data[]: '+LO.length+' int8 (0 free, 100 occupied, -1 unknown)</div>';
    /* topic inspector */
    var stamp=((performance.now()-t0)/1000).toFixed(1),rs=scan.slice(0,5).map(function(s){return fmt(s.r);}).join(', ');
    topicPre.innerHTML=
      '<b>/cmd_vel</b>  geometry_msgs/msg/Twist  <i>pub: '+(mode==='manual'?'teleop_twist_keyboard':'navigation controller')+'</i>\n'+
      'linear:  x: '+cmd.v.toFixed(3)+'  y: 0.0  z: 0.0\n'+
      'angular: x: 0.0  y: 0.0  z: '+cmd.w.toFixed(3)+'\n\n'+
      '<b>/odom</b>  nav_msgs/msg/Odometry  <i>pub: gazebo diff_drive plugin</i>\n'+
      'header: {stamp: '+stamp+', frame_id: odom}  child_frame_id: base_link\n'+
      'pose.position: x: '+odom.x.toFixed(3)+'  y: '+odom.y.toFixed(3)+'  z: 0.0\n'+
      'pose.yaw: '+odom.th.toFixed(3)+'\n'+
      'twist: linear.x: '+robot.v.toFixed(3)+'  angular.z: '+robot.w.toFixed(3)+'\n\n'+
      '<b>/scan</b>  sensor_msgs/msg/LaserScan  <i>pub: gazebo gpu_lidar</i>\n'+
      'header: {stamp: '+stamp+', frame_id: lidar_link}\n'+
      'ranges: ['+rs+', ... '+(N-5)+' more]';
  }

  /* ---- main loop with fixed sub-steps ---- */
  var last=performance.now(),accT=0,DT=1/120;
  function loop(ts){
    accT+=Math.min(0.05,(ts-last)/1000);last=ts;frameN++;
    if(robot){
      while(accT>=DT){step(DT);accT-=DT;}
      var tl=trail[trail.length-1];
      if(!tl||Math.hypot(tl[0]-robot.x,tl[1]-robot.y)>0.12){trail.push([robot.x,robot.y]);if(trail.length>160)trail.shift();}
      if(frameN%2===0){doScan();updateMap();}
      sweep+=TAU*1.5/60;
    }else accT=0;
    drawWorld(ts);drawLidar();
    if(frameN%2===0)drawMap();
    if(frameN%6===0)updateText();
    requestAnimationFrame(loop);
  }

  /* ---- interaction ---- */
  function setMode(m){
    mode=m;planVer=-1;if(m==='auto'&&navState==='arrived')navState='idle';
    modeToggle.querySelectorAll('button').forEach(function(b){b.classList.toggle('active',b.dataset.mode===m);});
  }
  function spawn(cx,cy){
    if(isBlocked(cx,cy))return;
    robot={x:cx+0.5,y:cy+0.5,th:0,vL:0,vR:0,v:0,w:0};
    odom={x:robot.x,y:robot.y,th:0};trail=[];path=[];planVer=-1;scan=[];resetMap();doScan();
  }
  function addGoal(cx,cy){
    if(isBlocked(cx,cy)||goalAt(cx,cy)>=0)return;
    var wasDone=(navState==='arrived');
    goals.push({cx:cx,cy:cy});
    if(goals.length===1||wasDone){wpIdx=goals.length-1;if(wasDone)navState='idle';}
    goal=goals[wpIdx];planVer=-1;
    if(robot)setMode('auto');
  }
  function removeGoal(i){
    goals.splice(i,1);wpIdx=clamp(wpIdx,0,Math.max(0,goals.length-1));
    goal=goals[wpIdx]||null;path=[];planVer=-1;if(!goal)navState='idle';
  }
  function paint(e){
    var rect=canvas.getBoundingClientRect(),cx=Math.floor((e.clientX-rect.left)*(W/rect.width)/cell),cy=Math.floor((e.clientY-rect.top)*(H/rect.height)/cell);
    if(cx<0||cy<0||cx>=cols||cy>=rows)return;
    var onRobot=robot&&Math.floor(robot.x)===cx&&Math.floor(robot.y)===cy,gi=goalAt(cx,cy),onGoal=gi>=0;
    if(tool==='robot'){spawn(cx,cy);}
    else if(tool==='goal'){addGoal(cx,cy);}
    else if(tool==='erase'){
      if(grid[key(cx,cy)]){delete grid[key(cx,cy)];gridVer++;}
      else if(onGoal){removeGoal(gi);}
      else if(onRobot){robot=null;scan=[];}
    }else if(!onRobot&&!onGoal&&grid[key(cx,cy)]!==tool){grid[key(cx,cy)]=tool;gridVer++;}
  }
  canvas.addEventListener('pointerdown',function(e){painting=true;try{canvas.setPointerCapture(e.pointerId);}catch(_){}paint(e);});
  canvas.addEventListener('pointermove',function(e){if(painting&&tool!=='robot'&&tool!=='goal')paint(e);});
  ['pointerup','pointercancel'].forEach(function(n){canvas.addEventListener(n,function(){painting=false;});});

  palette.querySelectorAll('.gz-pal-btn').forEach(function(btn){
    btn.addEventListener('click',function(){tool=btn.dataset.item;palette.querySelectorAll('.gz-pal-btn').forEach(function(b){b.classList.toggle('active',b===btn);});});
  });
  modeToggle.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.mode);});});
  loopBtn.addEventListener('click',function(){loopWp=!loopWp;loopBtn.textContent='Loop: '+(loopWp?'on':'off');if(loopWp&&navState==='arrived'){navState='idle';advanceWaypoint();}});
  $('wp-clear').addEventListener('click',function(){goals=[];wpIdx=0;goal=null;path=[];planVer=-1;navState='idle';});
  $('map-reset').addEventListener('click',resetMap);
  poseBtn.addEventListener('click',function(){mapPose=mapPose==='truth'?'odom':'truth';poseBtn.textContent='Pose: '+(mapPose==='truth'?'ground truth':'odometry');resetMap();});

  $('world-clear').addEventListener('click',function(){grid={};gridVer++;robot=null;goals=[];wpIdx=0;goal=null;path=[];trail=[];scan=[];navState='idle';resetMap();setMode('manual');});
  var DEMO=['......W......G','..FF..W..OO...','..FF..W.......','......WWWW.W..','..O........W..','WWWW.......WW.','...........O..','R.............'];
  function loadDemo(){
    grid={};goals=[];wpIdx=0;goal=null;robot=null;path=[];trail=[];scan=[];navState='idle';resetMap();
    DEMO.forEach(function(row,y){for(var x=0;x<cols;x++){var ch=row[x];
      if(ch==='W')grid[key(x,y)]='wall';else if(ch==='F')grid[key(x,y)]='house';else if(ch==='O')grid[key(x,y)]='obstacle';
      else if(ch==='G')goals.push({cx:x,cy:y});else if(ch==='R')spawn(x,y);}});
    goals.push({cx:12,cy:7},{cx:6,cy:7});goal=goals[0];
    gridVer++;setMode('manual');
  }
  $('world-demo').addEventListener('click',loadDemo);

  var KEY_DIR={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  window.addEventListener('keydown',function(e){
    if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
    var dir=KEY_DIR[e.key];if(!dir)return;
    held[dir]=1;if(mode==='auto'&&robot)setMode('manual');e.preventDefault();
  });
  window.addEventListener('keyup',function(e){var dir=KEY_DIR[e.key];if(dir)held[dir]=0;});
  dpad.querySelectorAll('button').forEach(function(btn){
    var dir=btn.dataset.dir;
    var press=function(e){held[dir]=1;btn.classList.add('held');if(mode==='auto'&&robot)setMode('manual');e.preventDefault();};
    var release=function(){held[dir]=0;btn.classList.remove('held');};
    btn.addEventListener('mousedown',press);btn.addEventListener('touchstart',press,{passive:false});
    ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(n){btn.addEventListener(n,release);});
  });

  loadDemo();updateText();requestAnimationFrame(loop);
})();

/* ============ Section 04: sim to real swap ============ */
(function(){
  var toggle=document.getElementById('swap-toggle'),endEl=document.getElementById('swap-end');
  toggle.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click',function(){
      var t=btn.dataset.target;
      toggle.querySelectorAll('button').forEach(function(b){b.classList.toggle('active',b===btn);});
      endEl.textContent=t==='sim'?'gazebo simulation':'real robot';
      endEl.className='gz-swap-end '+t;
    });
  });
})();

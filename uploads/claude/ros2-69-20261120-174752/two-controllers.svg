<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="The simple controller and the noisy controller both read joint_states. The simple controller publishes on bumperbot_controller/odom and sends the transform odom to base_footprint. The noisy controller adds noise, publishes on bumperbot_controller/odom_noisy and sends the transform odom to base_footprint_noisy. Both transforms have the same parent frame odom.">
<rect width="760" height="360" rx="14" fill="#0e182c"/>
<defs>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a3d"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5ab4ff"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#66e3b0"/></marker>
</defs>
<g font-family="system-ui,Segoe UI,Roboto,sans-serif">
<text x="24" y="28" fill="#a9b8cc" font-size="14">Two nodes read the same wheels and publish side by side, without mixing</text>
<rect x="120" y="44" width="270" height="44" rx="9" fill="#13213a" stroke="#5ab4ff" stroke-width="2"/>
<text x="255" y="63" fill="#e8eef7" font-size="14" text-anchor="middle" font-weight="700">/joint_states</text>
<text x="255" y="80" fill="#a9b8cc" font-size="12" text-anchor="middle" font-weight="400">the TRUE wheel angles</text>
<rect x="20" y="130" width="230" height="76" rx="9" fill="#13213a" stroke="#5ab4ff" stroke-width="2"/>
<text x="135" y="156" fill="#e8eef7" font-size="15" text-anchor="middle" font-weight="700">simple_controller</text>
<text x="135" y="178" fill="#a9b8cc" font-size="12.5" text-anchor="middle" font-weight="400">clean odometry</text>
<text x="135" y="196" fill="#6b7f96" font-size="11.5" text-anchor="middle" font-weight="400">chapters 62 to 66</text>
<rect x="270" y="130" width="230" height="76" rx="9" fill="#13213a" stroke="#ff8a3d" stroke-width="2"/>
<text x="385" y="156" fill="#e8eef7" font-size="15" text-anchor="middle" font-weight="700">noisy_controller</text>
<text x="385" y="178" fill="#ff8a3d" font-size="12.5" text-anchor="middle" font-weight="700">+ Gaussian noise (lines 70, 71)</text>
<text x="385" y="196" fill="#6b7f96" font-size="11.5" text-anchor="middle" font-weight="400">this chapter</text>
<line x1="135" y1="88" x2="135" y2="128" stroke="#5ab4ff" stroke-width="2.5" marker-end="url(#ab)"/>
<line x1="255" y1="88" x2="255" y2="108" stroke="#5ab4ff" stroke-width="2.5"/><line x1="255" y1="108" x2="385" y2="108" stroke="#5ab4ff" stroke-width="2.5"/>
<line x1="385" y1="108" x2="385" y2="128" stroke="#5ab4ff" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="20" y="236" width="230" height="32" rx="9" fill="#13213a" stroke="#5ab4ff" stroke-width="2"/>
<text x="135" y="257" fill="#e8eef7" font-size="12" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">bumperbot_controller/odom</text>
<rect x="20" y="288" width="230" height="32" rx="9" fill="#13213a" stroke="#5ab4ff" stroke-width="2"/>
<text x="135" y="309" fill="#e8eef7" font-size="12" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">/tf: odom to base_footprint</text>
<line x1="135" y1="206" x2="135" y2="234" stroke="#5ab4ff" stroke-width="2.5" marker-end="url(#ab)"/>
<line x1="135" y1="268" x2="135" y2="286" stroke="#5ab4ff" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="270" y="236" width="230" height="32" rx="9" fill="#13213a" stroke="#ff8a3d" stroke-width="2"/>
<text x="385" y="257" fill="#e8eef7" font-size="12" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">bumperbot_controller/odom_noisy</text>
<rect x="270" y="288" width="230" height="32" rx="9" fill="#13213a" stroke="#ff8a3d" stroke-width="2"/>
<text x="385" y="309" fill="#e8eef7" font-size="12" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">/tf: odom to base_footprint_noisy</text>
<line x1="385" y1="206" x2="385" y2="234" stroke="#ff8a3d" stroke-width="2.5" marker-end="url(#ao)"/>
<line x1="385" y1="268" x2="385" y2="286" stroke="#ff8a3d" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="385" y="342" fill="#ffd24a" font-size="11.5" text-anchor="middle" font-weight="400">Odometry message: child frame base_footprint_ekf (as first written)</text>
<rect x="540" y="96" width="200" height="232" rx="9" fill="#0f1b31" stroke="#23395c" stroke-width="2"/>
<text x="640" y="120" fill="#a9b8cc" font-size="13" text-anchor="middle" font-weight="700">the frames in RViz</text>
<rect x="580" y="140" width="120" height="32" rx="9" fill="#13213a" stroke="#66e3b0" stroke-width="2"/>
<text x="640" y="161" fill="#e8eef7" font-size="14" text-anchor="middle" font-weight="700">odom</text>
<line x1="640" y1="172" x2="640" y2="196" stroke="#66e3b0" stroke-width="2"/><line x1="600" y1="196" x2="680" y2="196" stroke="#66e3b0" stroke-width="2"/><line x1="600" y1="196" x2="600" y2="212" stroke="#5ab4ff" stroke-width="2.5" marker-end="url(#ab)"/><line x1="680" y1="196" x2="680" y2="212" stroke="#ff8a3d" stroke-width="2.5" marker-end="url(#ao)"/>
<rect x="552" y="214" width="100" height="44" rx="9" fill="#13213a" stroke="#5ab4ff" stroke-width="2"/>
<text x="602" y="232" fill="#e8eef7" font-size="12" text-anchor="middle" font-weight="700">base_</text>
<text x="602" y="248" fill="#e8eef7" font-size="12" text-anchor="middle" font-weight="700">footprint</text>
<rect x="662" y="214" width="70" height="44" rx="9" fill="#13213a" stroke="#ff8a3d" stroke-width="2"/>
<text x="697" y="230" fill="#e8eef7" font-size="11" text-anchor="middle" font-weight="700">base_</text>
<text x="697" y="242" fill="#e8eef7" font-size="11" text-anchor="middle" font-weight="700">footprint_</text>
<text x="697" y="254" fill="#e8eef7" font-size="11" text-anchor="middle" font-weight="700">noisy</text>
<text x="602" y="280" fill="#5ab4ff" font-size="11.5" text-anchor="middle" font-weight="400">clean robot</text>
<text x="697" y="280" fill="#ff8a3d" font-size="11.5" text-anchor="middle" font-weight="400">noisy robot</text>
<text x="640" y="306" fill="#a9b8cc" font-size="11.5" text-anchor="middle" font-weight="400">odom never moves; two moving children</text>
</g></svg>
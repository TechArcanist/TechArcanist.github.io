<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<rect width="600" height="360" fill="#0e182c"/>
<text x="20" y="26" fill="#a9b8cc" font-size="13">The robot seen from the side, heights to scale: 1 cm = 22 px</text>
<text x="20" y="44" fill="#6b7f96" font-size="11">body outline approximate; heights from the URDF</text>
<line x1="30" y1="318" x2="570" y2="318" stroke="#33465e" stroke-width="6"/>
<text x="560" y="340" fill="#6b7f96" font-size="11" text-anchor="end">floor</text>
<rect x="150" y="78" width="290" height="172" rx="16" fill="#c86a2c" fill-opacity=".35" stroke="#ff8a3d" stroke-width="2"/>
<text x="160" y="98" fill="#ffb27a" font-size="12">robot body</text>
<circle cx="310" cy="245" r="73" fill="#1b2633" fill-opacity=".85" stroke="#8aa0bd" stroke-width="3"/>

<text x="140" y="252" fill="#8aa0bd" font-size="11" text-anchor="end">wheel, radius 0.033 m</text><line x1="144" y1="248" x2="236" y2="248" stroke="#8aa0bd" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="415" cy="305" r="13" fill="#1b2633" stroke="#8aa0bd" stroke-width="2"/>
<text x="415" y="288" fill="#8aa0bd" font-size="10" text-anchor="middle">caster</text>
<circle cx="205" cy="305" r="13" fill="#1b2633" stroke="#8aa0bd" stroke-width="2"/>
<text x="205" y="288" fill="#8aa0bd" font-size="10" text-anchor="middle">caster</text>
<rect x="290" y="85" width="40" height="12" rx="3" fill="#cad1ee"/>
<circle cx="310" cy="91" r="5" fill="#ffd24a"/>
<line x1="310" y1="91" x2="372" y2="91" stroke="#ff6b6b" stroke-width="3"/>
<polygon points="382,91 370,85 370,97" fill="#ff6b6b"/>
<text x="386" y="95" fill="#ff6b6b" font-size="12">x</text>
<line x1="310" y1="91" x2="310" y2="62" stroke="#5ab4ff" stroke-width="3"/>
<text x="300" y="66" fill="#5ab4ff" font-size="12" text-anchor="end">z</text>
<text x="284" y="95" fill="#ffd24a" font-size="13" text-anchor="end">imu_link</text>
<circle cx="310" cy="245" r="5" fill="#ffffff"/>
<line x1="310" y1="245" x2="372" y2="245" stroke="#ff6b6b" stroke-width="3"/>
<polygon points="382,245 370,239 370,251" fill="#ff6b6b"/>
<text x="386" y="249" fill="#ff6b6b" font-size="12">x</text>
<line x1="310" y1="245" x2="310" y2="205" stroke="#5ab4ff" stroke-width="3"/>
<polygon points="310,197 304,209 316,209" fill="#5ab4ff"/>
<text x="320" y="210" fill="#5ab4ff" font-size="12">z</text>
<text x="318" y="232" fill="#ffffff" font-size="13">base_link</text>
<line x1="465" y1="91" x2="465" y2="245" stroke="#66e3b0" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="455" y1="91" x2="475" y2="91" stroke="#66e3b0" stroke-width="2"/>
<line x1="455" y1="245" x2="475" y2="245" stroke="#66e3b0" stroke-width="2"/>
<text x="482" y="162" fill="#66e3b0" font-size="13">0.0699 m</text>
<text x="482" y="180" fill="#66e3b0" font-size="13">(about 7 cm)</text>
<line x1="520" y1="245" x2="520" y2="318" stroke="#a9b8cc" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="512" y1="245" x2="528" y2="245" stroke="#a9b8cc" stroke-width="2"/>
<text x="530" y="280" fill="#a9b8cc" font-size="12">0.033 m</text>
<text x="20" y="352" fill="#a9b8cc" font-size="11">base_link sits at the wheel axles; the IMU is 0.033 + 0.0699 = 0.1029 m above the floor, near the top of the body</text>
</svg>

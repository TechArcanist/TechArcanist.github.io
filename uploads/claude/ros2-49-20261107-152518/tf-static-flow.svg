<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">How the static transform travels from the node to rviz2</title>
  <desc id="d">The simple_tf_kinematics node publishes the transform on the /tf_static topic. The ros2 topic echo command and the rviz2 TF display both read it.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="760" height="250" rx="14" fill="#0e182c"/>

  <!-- Node -->
  <rect x="30" y="80" width="200" height="90" rx="12" fill="#131b33" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="130" y="108" fill="#94a1c2" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">NODE</text>
  <text x="130" y="130" fill="#e6ebf8" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">simple_tf_kinematics</text>
  <text x="130" y="152" fill="#94a1c2" font-size="12" text-anchor="middle">StaticTransformBroadcaster</text>

  <!-- Topic -->
  <line x1="230" y1="125" x2="300" y2="125" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="265" y="113" fill="#94a1c2" font-size="11" text-anchor="middle">publishes</text>

  <rect x="305" y="95" width="150" height="60" rx="30" fill="#0f1730" stroke="#5eead4" stroke-width="1.5"/>
  <text x="380" y="119" fill="#94a1c2" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">TOPIC</text>
  <text x="380" y="140" fill="#5eead4" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">/tf_static</text>

  <!-- Readers -->
  <line x1="455" y1="115" x2="520" y2="70" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="455" y1="135" x2="520" y2="180" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#ah)"/>

  <rect x="525" y="40" width="205" height="60" rx="12" fill="#131b33" stroke="#27335a" stroke-width="1.5"/>
  <text x="627" y="64" fill="#e6ebf8" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">ros2 topic echo</text>
  <text x="627" y="84" fill="#94a1c2" font-size="12" text-anchor="middle">prints the raw message</text>

  <rect x="525" y="150" width="205" height="60" rx="12" fill="#131b33" stroke="#27335a" stroke-width="1.5"/>
  <text x="627" y="174" fill="#e6ebf8" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">rviz2 (TF display)</text>
  <text x="627" y="194" fill="#94a1c2" font-size="12" text-anchor="middle">draws the two frames</text>

  <text x="30" y="232" fill="#94a1c2" font-size="12">Both tools subscribe to /tf_static. In rviz2, Fixed Frame is set to bumperbot_base, the parent frame.</text>
</svg>

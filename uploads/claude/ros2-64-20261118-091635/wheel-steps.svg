<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Two wheels seen from above. The left wheel rolled 0.004575 m and the right wheel 0.005425 m. Their average, 0.005 m, is the step forward d_s. Their difference, 0.00085 m, divided by the wheel separation 0.17 m gives the turn d_theta of 0.005 rad.">
<rect width="760" height="350" rx="14" fill="#0e182c"/>
<defs>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a3d"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5ab4ff"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#66e3b0"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd24a"/></marker>
</defs>
<g font-family="system-ui,Segoe UI,Roboto,sans-serif">
<text x="24" y="30" fill="#a9b8cc" font-size="14">Seen from above, robot facing up. One reading (10 ms) of the drive and turn test. Not to scale.</text>
<rect x="162" y="240" width="116" height="64" rx="8" fill="#13213a" stroke="#2b4366" stroke-width="2"/>
<text x="220" y="276" fill="#a9b8cc" font-size="13" text-anchor="middle">robot</text>
<rect x="139" y="235" width="22" height="66" rx="5" fill="#1b2c4a" stroke="#5ab4ff" stroke-width="2"/>
<rect x="279" y="235" width="22" height="66" rx="5" fill="#1b2c4a" stroke="#5ab4ff" stroke-width="2"/>
<line x1="150" y1="320" x2="290" y2="320" stroke="#a9b8cc" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="220" y="340" fill="#a9b8cc" font-size="13" text-anchor="middle">s = 0.17 m (wheel separation)</text>
<line x1="150" y1="232" x2="150" y2="131.3" stroke="#5ab4ff" stroke-width="4" marker-end="url(#ab)"/>
<line x1="290" y1="232" x2="290" y2="112.7" stroke="#66e3b0" stroke-width="4" marker-end="url(#ag)"/>
<line x1="150" y1="131.3" x2="290" y2="112.7" stroke="#ffd24a" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="220" y1="232" x2="220" y2="122.0" stroke="#ff8a3d" stroke-width="5" marker-end="url(#ao)"/>
<text x="220" y="98.0" fill="#ff8a3d" font-size="13" text-anchor="middle" font-weight="700">d_s</text>
<text x="150" y="62" fill="#5ab4ff" font-size="13" text-anchor="middle">left wheel rolled</text>
<text x="150" y="80" fill="#5ab4ff" font-size="13" text-anchor="middle" font-weight="700">r × dp_left</text>
<text x="150" y="98" fill="#5ab4ff" font-size="13" text-anchor="middle" font-weight="700">= 0.004575 m</text>
<text x="290" y="62" fill="#66e3b0" font-size="13" text-anchor="middle">right wheel rolled</text>
<text x="290" y="80" fill="#66e3b0" font-size="13" text-anchor="middle" font-weight="700">r × dp_right</text>
<text x="290" y="98" fill="#66e3b0" font-size="13" text-anchor="middle" font-weight="700">= 0.005425 m</text>
<rect x="478" y="52" width="258" height="288" rx="10" fill="#0f1b31" stroke="#23395c"/>
<text x="492" y="80" fill="#ff8a3d" font-size="12.5" font-weight="700">The step forward</text>
<text x="492" y="100" fill="#a9b8cc" font-size="12.5" font-weight="400">the average of the distances</text>
<text x="492" y="120" fill="#e8eef7" font-size="12.5" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">d_s&#160;=&#160;(0.005425&#160;+&#160;0.004575)</text>
<text x="492" y="140" fill="#e8eef7" font-size="12.5" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">&#160;&#160;&#160;&#160;÷&#160;2&#160;=&#160;0.005&#160;m</text>
<text x="492" y="180" fill="#ffd24a" font-size="12.5" font-weight="700">The turn</text>
<text x="492" y="200" fill="#a9b8cc" font-size="12.5" font-weight="400">the difference divided by s</text>
<text x="492" y="220" fill="#e8eef7" font-size="12.5" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">d_theta&#160;=&#160;(0.005425</text>
<text x="492" y="240" fill="#e8eef7" font-size="12.5" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">&#160;&#160;&#160;&#160;minus&#160;0.004575)</text>
<text x="492" y="260" fill="#e8eef7" font-size="12.5" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">&#160;&#160;&#160;&#160;÷&#160;0.17&#160;=&#160;0.005&#160;rad</text>
<text x="492" y="300" fill="#a9b8cc" font-size="12.5" font-weight="400">The right wheel rolled farther,</text>
<text x="492" y="320" fill="#a9b8cc" font-size="12.5" font-weight="400">so the robot turns to the left.</text>
</g></svg>
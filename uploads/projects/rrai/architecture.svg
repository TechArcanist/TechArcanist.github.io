<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<rect width="960" height="430" rx="16" fill="#0e182c"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a3d"/></marker></defs>
<g font-size="15" text-anchor="middle">
<rect x="30" y="40" width="260" height="74" rx="10" fill="#13213a" stroke="#ff8a3d" stroke-width="2"/><text x="160" y="70" fill="#e8eef7">Public pages</text><text x="160" y="92" fill="#a9b8cc" font-size="12.5">static HTML, CSS, vanilla JS</text>
<rect x="30" y="290" width="260" height="74" rx="10" fill="#13213a" stroke="#ff8a3d" stroke-width="2"/><text x="160" y="320" fill="#e8eef7">Admin panel (/admin)</text><text x="160" y="342" fill="#a9b8cc" font-size="12.5">unlisted, not indexed</text>
<rect x="370" y="150" width="260" height="110" rx="10" fill="#13213a" stroke="#2b4366" stroke-width="2"/><text x="500" y="182" fill="#e8eef7">Cloud Firestore</text><text x="500" y="204" fill="#a9b8cc" font-size="12.5">products, portfolio, team,</text><text x="500" y="222" fill="#a9b8cc" font-size="12.5">collaborations, settings,</text><text x="500" y="240" fill="#a9b8cc" font-size="12.5">enquiries</text>
<rect x="700" y="40" width="230" height="74" rx="10" fill="#13213a" stroke="#2b4366" stroke-width="2"/><text x="815" y="70" fill="#e8eef7">Firebase Hosting</text><text x="815" y="92" fill="#a9b8cc" font-size="12.5">CDN, SSL, security headers</text>
<rect x="700" y="290" width="230" height="74" rx="10" fill="#13213a" stroke="#2b4366" stroke-width="2"/><text x="815" y="320" fill="#e8eef7">Google sign-in</text><text x="815" y="342" fill="#a9b8cc" font-size="12.5">allowlisted owner only</text>
</g>
<path d="M700 77H294" stroke="#ff8a3d" stroke-width="2.5" marker-end="url(#a)"/><text x="497" y="68" fill="#a9b8cc" font-size="12.5" text-anchor="middle">serves every page</text>
<path d="M250 118L410 146" stroke="#ff8a3d" stroke-width="2.5" marker-end="url(#a)"/><text x="40" y="140" fill="#a9b8cc" font-size="12.5">reads content, sends enquiries</text>
<path d="M250 286L410 264" stroke="#ff8a3d" stroke-width="2.5" marker-end="url(#a)"/><text x="40" y="276" fill="#a9b8cc" font-size="12.5">edits content, reads enquiries</text>
<path d="M700 327H294" stroke="#ff8a3d" stroke-width="2.5" marker-end="url(#a)"/><text x="497" y="318" fill="#a9b8cc" font-size="12.5" text-anchor="middle">signs the owner in</text>
<text x="30" y="410" fill="#a9b8cc" font-size="12.5">No server of its own: Firestore security rules decide who may read and write each collection. Built-in content shows if Firestore is unreachable.</text>
</svg>
